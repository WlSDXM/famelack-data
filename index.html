<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Earth — World Views & Radio</title>
    <link rel="icon" href="https://i.imgur.com/KwX2CTv.gif">
    <meta property="og:image" content="https://i.postimg.cc/bJBx0GRz/jpnearth-ascii-art-ezgif-com-optimize-(1).gif" />
    <meta property="twitter:card" content="summary_large_image">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #0a0a0a;
            --border-color: #333;
            --text-color: #e0e0e0;
            --text-muted: #888;
            --accent-color: #4a9eff;
        }

        @font-face {
            font-family: 'stealth57';
            src: url('https://raw.githubusercontent.com/WlSDXM/famelack-data/main/stealth57.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; }

        html {
            background-color: var(--bg-color) !important;
            min-height: 100%;
        }

        body {
            background-color: var(--bg-color) !important;
            min-height: 100vh;
            color: var(--text-color);
            font-family: 'stealth57', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 17px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1.earth-title {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin: 0 0 20px 0;
            text-align: center;
        }
        img.earth-anim {
            max-width: 100%;
            height: 80px;
            width: auto;
            display: block;
            margin: 0 auto;
            mix-blend-mode: lighten;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            gap: 30px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
            min-width: 0;
        }

        .right-column .player-box {
            min-height: 380px;
        }

        .player-box {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: var(--accent-color);
            margin-top: 0;
        }
        h2.title-gif {
            margin-top: 0;
            line-height: 1;
        }
        img.title-img {
            display: block;
            height: 40px;
            width: auto;
            mix-blend-mode: lighten;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            min-width: 0;
            overflow: hidden;
        }

        select {
            flex: 1 1 0%;
            min-width: 0;
            width: 0;
            max-width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 16px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
            box-sizing: border-box;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
        select:focus { outline: none; border-color: var(--accent-color); }

        video {
            width: 100%;
            border-radius: 4px;
            background-color: #000;
            display: block;
        }
        iframe#webcamFrame {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 4px;
            background-color: #000;
            display: block;
        }
        audio { width: 100%; margin-top: 4px; }

        .cam-nav {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 10px;
        }
        .cam-nav.visible { display: flex; }
        .cam-nav button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 15px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
        }
        .cam-nav button:hover:not(:disabled) {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .cam-nav button:disabled { opacity: 0.35; cursor: default; }
        .cam-title {
            flex: 1;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .cam-star {
            background-color: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 15px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
            line-height: 1;
            transition: color 0.15s, border-color 0.15s, text-shadow 0.15s;
        }
        .cam-star:hover {
            border-color: #ffd966;
            color: #ffd966;
        }
        .cam-star.active {
            color: #ffd966;
            border-color: #ffd966;
            text-shadow: 0 0 6px rgba(255, 217, 102, 0.6);
        }

        .viz-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }
        .viz-controls label {
            color: var(--text-muted);
            font-size: 14px;
            font-family: 'stealth57', monospace;
        }
        .viz-controls select { flex: 0 0 160px; }

        #visualizer, pre#asciiViz {
            width: 100% !important;
            max-width: 100%;
            height: 90px !important;
            min-height: 90px;
            max-height: 90px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px;
            display: block;
            box-sizing: border-box;
        }

        pre#asciiViz {
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 11px;
            line-height: 1.05;
            color: var(--accent-color);
            padding: 8px;
            margin: 10px 0 0 0;
            white-space: pre;
            overflow: hidden;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            word-break: break-all;
        }

        .viz-fallback {
            display: none;
            width: 100%;
            height: 90px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 13px;
            font-family: 'stealth57', monospace;
            text-align: center;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .viz-fallback.visible {
            display: flex;
        }

        #globeCanvas {
            width: 100%;
            height: 236px;
            display: block;
            cursor: pointer;
            background: transparent;
            border: none;
            margin: 0 auto;
            margin-top: -25px;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
                padding-bottom: 10px;
            }

            .container { max-width: 100%; }

            h1.earth-title {
                padding-bottom: 6px;
                margin: 0 0 12px 0;
            }

            img.earth-anim { height: 55px; }

            .layout-grid { gap: 16px; }
            .right-column { gap: 16px; }

            .player-box {
                padding: 12px;
                border-radius: 6px;
            }

            img.title-img { height: 28px; }

            .row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                margin-bottom: 10px;
            }

            select {
                width: 100%;
                font-size: 16px;
                padding: 10px 12px;
            }

            .cam-nav {
                gap: 6px;
                margin-top: 8px;
                flex-wrap: wrap;
            }

            .cam-nav button {
                padding: 10px 16px;
                font-size: 16px;
                min-width: 46px;
            }

            .cam-star {
                padding: 10px 16px;
                font-size: 18px;
                min-width: 46px;
            }

            .cam-title {
                font-size: 12px;
                flex-basis: 100%;
                order: -1;
                margin-bottom: 6px;
            }

            #visualizer, pre#asciiViz, .viz-fallback {
                height: 70px !important;
                min-height: 70px;
                max-height: 70px;
            }

            pre#asciiViz {
                font-size: 8px;
                line-height: 1.05;
                padding: 6px;
            }

            .viz-controls {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: flex-end;
            }

            .viz-controls select { flex: 1 1 100%; }

            #globeCanvas {
                height: 180px;
                margin-top: -10px;
            }

            iframe#webcamFrame,
            video { border-radius: 4px; }

            .right-column .player-box { min-height: auto; }
        }

        @media (max-width: 380px) {
            img.earth-anim { height: 42px; }
            img.title-img { height: 22px; }
            #globeCanvas { height: 150px; }
            .player-box { padding: 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="earth-title">
        <img src="https://i.postimg.cc/K8TkJTVF/EARTHripple-ezgif-com-video-to-gif-converter.gif" alt="EARTH" class="earth-anim">
    </h1>

    <div class="layout-grid">

        <!-- ===== LIVE (left column) ===== -->
        <div class="player-box">
            <h2 class="title-gif">
                <img src="https://i.postimg.cc/QMsm9d2H/Live-ezgif-com-video-to-gif-converter.gif" alt="Live" class="title-img">
            </h2>
            <div class="row">
                <select id="countrySelect">
                    <option value="">-- Select a Country --</option>
                </select>
                <select id="camSelect" disabled>
                    <option value="">-- Select a Cam --</option>
                </select>
            </div>
            <video id="webcamPlayer" controls autoplay muted></video>
            <div class="cam-nav" id="camNav">
                <button id="camPrev" title="Previous camera">◀</button>
                <span class="cam-title" id="camTitle"></span>
                <button id="camNext" title="Next camera">▶</button>
                <button id="camStar" class="cam-star" title="Save to favorites">★</button>
            </div>
        </div>

        <!-- ===== RIGHT COLUMN (Radio + Globe) ===== -->
        <div class="right-column">

            <div class="player-box">
                <h2 class="title-gif">
                    <img src="https://i.postimg.cc/1zftKGhW/RADIO-ezgif-com-video-to-gif-converter.gif" alt="Radio" class="title-img">
                </h2>

                <div class="row">
                    <select id="radioCountrySelect">
                        <option value="">-- Select a Country --</option>
                    </select>
                </div>

                <div class="row">
                    <select id="radioStationSelect" disabled>
                        <option value="">-- Select a Station --</option>
                    </select>
                </div>

                <audio id="radioPlayer" controls crossorigin="anonymous"></audio>

                <div class="viz-controls">
                    <label for="vizStyle">Visualizer:</label>
                    <select id="vizStyle">
                        <option value="bars">Bars</option>
                        <option value="wave">Wave</option>
                        <option value="ascii">ASCII</option>
                        <option value="ansi">ANSI</option>
                    </select>
                    <button id="radioStar" class="cam-star" title="Save to favorites" style="margin-left: auto;">★</button>
                </div>

                <canvas id="visualizer"></canvas>
                <pre id="asciiViz" style="display:none;"></pre>
                <div id="vizFallback" class="viz-fallback">Visualizer not available on this device</div>
            </div>

            <!-- ===== GLOBE (below Radio, no box) ===== -->
            <canvas id="globeCanvas" title="Click to change color"></canvas>

        </div>
    </div>
</div>

<script>
    const BASE = 'https://raw.githubusercontent.com/WlSDXM/famelack-data/main';

    const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    // ============ WEBCAM ============
    const video = document.getElementById('webcamPlayer');
    const countrySelect = document.getElementById('countrySelect');
    const camNav = document.getElementById('camNav');
    const camPrev = document.getElementById('camPrev');
    const camNext = document.getElementById('camNext');
    const camTitle = document.getElementById('camTitle');
    const camSelect = document.getElementById('camSelect');
    const camStar = document.getElementById('camStar');

    let camList = [];
    let camIndex = 0;
    let webcamFrame = null;

    const FAV_KEY = 'earth_favoriteCams';

    function getFavorites() {
        try {
            return JSON.parse(localStorage.getItem(FAV_KEY)) || [];
        } catch {
            return [];
        }
    }

    function saveFavorites(list) {
        localStorage.setItem(FAV_KEY, JSON.stringify(list));
    }

    function currentCamId() {
        const item = camList[camIndex];
        return item ? item.nanoid : null;
    }

    function updateStarState() {
        const id = currentCamId();
        const isFav = id && getFavorites().some(f => f.id === id);
        camStar.classList.toggle('active', !!isFav);
        camStar.title = isFav ? 'Remove from favorites' : 'Save to favorites';
    }

    function buildFavoritesGroup() {
        const favorites = getFavorites();
        if (favorites.length === 0) return;

        const group = document.createElement('optgroup');
        group.label = '★ Favorites';

        favorites.forEach(fav => {
            const opt = document.createElement('option');
            opt.value = `fav:${fav.id}`;
            opt.textContent = `${fav.name} (${fav.country.toUpperCase()})`;
            group.appendChild(opt);
        });

        camSelect.appendChild(group);
    }

    camStar.addEventListener('click', () => {
        const item = camList[camIndex];
        if (!item) return;
        const favorites = getFavorites();
        const existing = favorites.findIndex(f => f.id === item.nanoid);

        if (existing >= 0) {
            favorites.splice(existing, 1);
        } else {
            favorites.push({
                id: item.nanoid,
                name: item.name,
                country: countrySelect.value,
                youtube: item.sources.youtube[0]
            });
        }
        saveFavorites(favorites);
        updateStarState();
    });

    async function loadWebcamCountries() {
        try {
            const response = await fetch(`${BASE}/webcams/raw/countries_metadata.json`);
            const data = await response.json();
            Object.entries(data).forEach(([code, info]) => {
                if (!info.hasChannels) return;
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${info.country} (${info.channelCount})`;
                countrySelect.appendChild(option);
            });
        } catch (error) {
            console.error('Failed to load webcam countries:', error);
        }
    }

    countrySelect.addEventListener('change', async (e) => {
        const code = e.target.value;

        camSelect.innerHTML = '<option value="">-- Select a Cam --</option>';
        camSelect.disabled = true;

        if (!code) return;
        try {
            const response = await fetch(`${BASE}/webcams/raw/countries/${code.toLowerCase()}.json`);
            const items = await response.json();
            camList = items.filter(i => i.sources && i.sources.youtube && i.sources.youtube[0]);
            camIndex = 0;

            buildFavoritesGroup();

            camList.forEach((cam, i) => {
                const opt = document.createElement('option');
                opt.value = `cam:${i}`;
                opt.textContent = cam.name || `Cam ${i + 1}`;
                camSelect.appendChild(opt);
            });
            camSelect.disabled = camList.length === 0;
            if (camList.length > 0) camSelect.value = 'cam:0';

            updateCamNav();
            if (camList.length > 0) playWebcam(0);
        } catch (error) {
            console.error('Failed to load webcam data for', code, error);
        }
    });

    camPrev.addEventListener('click', () => {
        if (camIndex > 0) {
            camIndex--;
            playWebcam(camIndex);
            updateCamNav();
            camSelect.value = `cam:${camIndex}`;
        }
    });

    camNext.addEventListener('click', () => {
        if (camIndex < camList.length - 1) {
            camIndex++;
            playWebcam(camIndex);
            updateCamNav();
            camSelect.value = `cam:${camIndex}`;
        }
    });

    camSelect.addEventListener('change', async (e) => {
        const value = e.target.value;
        if (!value) return;

        if (value.startsWith('cam:')) {
            const idx = parseInt(value.slice(4), 10);
            if (isNaN(idx)) return;
            camIndex = idx;
            playWebcam(camIndex);
            updateCamNav();
            return;
        }

        if (value.startsWith('fav:')) {
            const favId = value.slice(4);
            const fav = getFavorites().find(f => f.id === favId);
            if (!fav) return;

            if (fav.country === countrySelect.value) {
                const idx = camList.findIndex(c => c.nanoid === fav.id);
                if (idx >= 0) {
                    camIndex = idx;
                    playWebcam(camIndex);
                    updateCamNav();
                    camSelect.value = `cam:${camIndex}`;
                }
                return;
            }

            countrySelect.value = fav.country;
            countrySelect.dispatchEvent(new Event('change'));

            const tryJump = () => {
                const idx = camList.findIndex(c => c.nanoid === fav.id);
                if (idx >= 0) {
                    camIndex = idx;
                    playWebcam(camIndex);
                    updateCamNav();
                    camSelect.value = `cam:${camIndex}`;
                } else {
                    setTimeout(tryJump, 100);
                }
            };
            setTimeout(tryJump, 100);
        }
    });

    function updateCamNav() {
        if (camList.length === 0) {
            camNav.classList.remove('visible');
            return;
        }
        camNav.classList.add('visible');
        camTitle.textContent = camList.length > 1
            ? `${camList[camIndex].name} — ${camIndex + 1} / ${camList.length}`
            : camList[camIndex].name;
        camPrev.disabled = camIndex === 0;
        camNext.disabled = camIndex === camList.length - 1;
        camPrev.style.display = camList.length > 1 ? '' : 'none';
        camNext.style.display = camList.length > 1 ? '' : 'none';
    }

    function playWebcam(index) {
        const item = camList[index];
        if (!item) return;
        const embedUrl = item.sources.youtube[0];

        if (!webcamFrame) {
            webcamFrame = document.createElement('iframe');
            webcamFrame.id = 'webcamFrame';
            webcamFrame.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
            webcamFrame.setAttribute('allowfullscreen', '');
            video.parentElement.insertBefore(webcamFrame, video);
            video.style.display = 'none';
        }
        webcamFrame.src = embedUrl + '?autoplay=1&mute=1';
        updateStarState();
    }

    // ============ RADIO ============
    const audio = document.getElementById('radioPlayer');
    const radioCountrySelect = document.getElementById('radioCountrySelect');
    const radioStationSelect = document.getElementById('radioStationSelect');
    const radioStar = document.getElementById('radioStar');

    const RADIO_FAV_KEY = 'earth_favoriteStations';

    function getRadioFavorites() {
        try {
            return JSON.parse(localStorage.getItem(RADIO_FAV_KEY)) || [];
        } catch {
            return [];
        }
    }

    function saveRadioFavorites(list) {
        localStorage.setItem(RADIO_FAV_KEY, JSON.stringify(list));
    }

    function updateRadioStarState() {
        const url = audio.src;
        const isFav = url && getRadioFavorites().some(f => f.url === url);
        radioStar.classList.toggle('active', !!isFav);
        radioStar.title = isFav ? 'Remove from favorites' : 'Save to favorites';
    }

    function buildRadioFavoritesGroup() {
        const favorites = getRadioFavorites();
        if (favorites.length === 0) return;

        const group = document.createElement('optgroup');
        group.label = '★ Favorites';

        favorites.forEach(fav => {
            const opt = document.createElement('option');
            opt.value = `fav:${fav.url}`;
            opt.textContent = `${fav.name} (${fav.country.toUpperCase()})`;
            group.appendChild(opt);
        });

        radioStationSelect.appendChild(group);
    }

    radioStar.addEventListener('click', () => {
        const url = audio.src;
        if (!url) return;

        const favorites = getRadioFavorites();
        const existing = favorites.findIndex(f => f.url === url);

        if (existing >= 0) {
            favorites.splice(existing, 1);
        } else {
            const selectedOpt = radioStationSelect.options[radioStationSelect.selectedIndex];
            const name = selectedOpt ? selectedOpt.textContent : 'Unknown Station';
            favorites.push({
                url,
                name,
                country: radioCountrySelect.value
            });
        }
        saveRadioFavorites(favorites);
        updateRadioStarState();
    });

    async function loadRadioCountries() {
        try {
            const response = await fetch(`${BASE}/radio/raw/countries_metadata.json`);
            const data = await response.json();
            Object.entries(data).forEach(([code, info]) => {
                if (!info.hasChannels) return;
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${info.country} (${info.channelCount})`;
                radioCountrySelect.appendChild(option);
            });
        } catch (error) {
            console.error('Failed to load radio countries:', error);
        }
    }

    radioCountrySelect.addEventListener('change', async (e) => {
        const code = e.target.value;
        radioStationSelect.innerHTML = '<option value="">-- Select a Station --</option>';
        radioStationSelect.disabled = true;
        if (!code) return;

        try {
            const response = await fetch(`${BASE}/radio/raw/countries/${code.toLowerCase()}.json`);
            const items = await response.json();
            if (!Array.isArray(items)) return;

            buildRadioFavoritesGroup();

            const seen = new Set();
            items.forEach((item) => {
                const streamUrl = item.sources && item.sources.streams && item.sources.streams[0];
                if (!streamUrl) return;
                const name = item.name || 'Unknown Station';
                if (seen.has(name)) return;
                seen.add(name);

                const option = document.createElement('option');
                option.value = streamUrl;
                option.textContent = name;
                radioStationSelect.appendChild(option);
            });
            radioStationSelect.disabled = false;
        } catch (error) {
            console.error('Failed to load radio stations for', code, error);
        }
    });

    radioStationSelect.addEventListener('change', (e) => {
        const value = e.target.value;
        if (!value) {
            audio.pause();
            audio.src = '';
            updateRadioStarState();
            return;
        }

        if (value.startsWith('fav:')) {
            const url = value.slice(4);
            audio.src = url;
            audio.play().catch(err => console.log('Playback failed:', err));
            updateRadioStarState();
            return;
        }

        audio.src = value;
        audio.play().catch(err => console.log('Playback failed:', err));
        updateRadioStarState();
    });

    // ============ VISUALIZER ============
    const canvas = document.getElementById('visualizer');
    const asciiViz = document.getElementById('asciiViz');
    const vizStyleSelect = document.getElementById('vizStyle');
    const vizFallback = document.getElementById('vizFallback');
    const ctx = canvas ? canvas.getContext('2d') : null;

    let audioCtx, analyser, source, freqData, timeData;
    let currentStyle = 'bars';
    let visualizerDisabled = false;

    if (IS_MOBILE) {
        visualizerDisabled = true;
        if (canvas) canvas.style.display = 'none';
        if (asciiViz) asciiViz.style.display = 'none';
        if (vizFallback) vizFallback.classList.add('visible');
        const vizLabel = document.querySelector('.viz-controls label');
        const vizSelect = document.getElementById('vizStyle');
        if (vizLabel) vizLabel.style.display = 'none';
        if (vizSelect) vizSelect.style.display = 'none';
    }

    if (!visualizerDisabled && vizStyleSelect) {
        vizStyleSelect.addEventListener('change', (e) => {
            currentStyle = e.target.value;

            if (currentStyle === 'ascii') {
                canvas.style.display = 'none';
                asciiViz.style.display = 'block';
                if (analyser) drawAscii();
            } else {
                canvas.style.display = 'block';
                asciiViz.style.display = 'none';
                requestAnimationFrame(() => requestAnimationFrame(() => sizeCanvas()));
            }
        });
    }

    function sizeCanvas() {
        if (!canvas || !ctx) return;
        const rect = canvas.getBoundingClientRect();
        const w = Math.floor(rect.width);
        const h = Math.floor(rect.height);
        if (w < 10 || h < 10) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }

    window.addEventListener('load', () => {
        if (!visualizerDisabled) sizeCanvas();
    });

    function initVisualizer() {
        if (visualizerDisabled) return;
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.8;
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            freqData = new Uint8Array(analyser.frequencyBinCount);
            timeData = new Uint8Array(analyser.fftSize);
        } catch (e) {
            console.warn('Visualizer init failed:', e);
            visualizerDisabled = true;
            if (canvas) canvas.style.display = 'none';
            if (asciiViz) asciiViz.style.display = 'none';
            if (vizFallback) vizFallback.classList.add('visible');
            const vizLabel = document.querySelector('.viz-controls label');
            const vizSelect = document.getElementById('vizStyle');
            if (vizLabel) vizLabel.style.display = 'none';
            if (vizSelect) vizSelect.style.display = 'none';
        }
    }

    function drawBars(w, h) {
        analyser.getByteFrequencyData(freqData);
        const barCount = 500;
        const barWidth = w / barCount;
        const maxBin = freqData.length;

        for (let i = 0; i < barCount; i++) {
            const t = i / barCount;
            const logPos = Math.pow(t, 2.2);
            const binIndex = Math.floor(logPos * maxBin);

            const windowSize = Math.max(1, Math.floor(maxBin / barCount));
            let sum = 0, count = 0;
            for (let j = binIndex; j < binIndex + windowSize && j < freqData.length; j++) {
                sum += freqData[j];
                count++;
            }
            let value = count > 0 ? sum / count / 255 : 0;
            value = Math.pow(value, 0.7);
            value = Math.min(1, value * 1.15);

            const barHeight = value * (h * 0.9);
            const x = i * barWidth;
            const y = h - barHeight;

            const hue = 210 + (i / barCount) * 100;
            ctx.fillStyle = `hsl(${hue}, 80%, ${40 + value * 30}%)`;
            ctx.fillRect(x, y, barWidth, barHeight);
        }
    }

    function drawWave(w, h) {
        analyser.getByteTimeDomainData(timeData);

        const layers = 7;
        const base = new Array(timeData.length);
        for (let i = 0; i < timeData.length; i++) {
            base[i] = (timeData[i] - 128) / 128;
        }

        const smoothed = base.map((_, i) => {
            const a = base[Math.max(0, i - 2)];
            const b = base[i];
            const c = base[Math.min(base.length - 1, i + 2)];
            return (a + b * 2 + c) / 4;
        });

        for (let l = layers - 1; l >= 0; l--) {
            const depth = l / (layers - 1);
            const verticalOffset = depth * h * 0.28;
            const amplitude = (1 - depth * 0.35);
            const phaseShift = Math.floor(depth * 12);

            const alpha = 0.85 - depth * 0.6;
            const lightness = 95 - depth * 45;

            ctx.beginPath();
            for (let i = 0; i < smoothed.length; i++) {
                const src = smoothed[(i + phaseShift) % smoothed.length];
                const x = (i / (smoothed.length - 1)) * w;
                const y = h * 0.55 + src * (h * 0.35) * amplitude - verticalOffset;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }

            ctx.strokeStyle = `hsla(210, 30%, ${lightness}%, ${alpha})`;
            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        if (!window.__wavePeak || window.__wavePeak.length !== smoothed.length) {
            window.__wavePeak = new Array(smoothed.length).fill(0);
        }
        for (let i = 0; i < smoothed.length; i++) {
            const v = Math.abs(smoothed[i]);
            if (v > window.__wavePeak[i]) window.__wavePeak[i] = v;
            else window.__wavePeak[i] *= 0.97;
        }

        ctx.beginPath();
        for (let i = 0; i < smoothed.length; i++) {
            const x = (i / (smoothed.length - 1)) * w;
            const y = h * 0.55 - window.__wavePeak[i] * (h * 0.35);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(220, 60, 80, 0.85)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
    }

    const ASCII_CHARS = ' .:-=+*#%@';
    const ASCII_COLS = 60;
    const ASCII_ROWS = 8;

    // ============ ANSI VISUALIZER ============
    const CGA_PALETTE = [
        '#000000', '#0000AA', '#00AA00', '#00AAAA',
        '#AA0000', '#AA00AA', '#AA5500', '#AAAAAA',
        '#555555', '#5555FF', '#55FF55', '#55FFFF',
        '#FF5555', '#FF55FF', '#FFFF55', '#FFFFFF'
    ];

    const ANSI_COLORS = [9, 10, 11, 12, 13, 14, 15];

    const ANSI_ROWS = 6;
    const ANSI_MONO = '#e0e0e0';
    let ansiColorMode = false;

    canvas.addEventListener('click', () => {
        if (currentStyle === 'ansi') {
            ansiColorMode = !ansiColorMode;
        }
    });

    function drawANSI(w, h) {
    analyser.getByteFrequencyData(freqData);

    const padX = 4;
    const padY = 3;
    const innerW = w - padX * 2;
    const innerH = h - padY * 2;

    const charH = innerH / (ANSI_ROWS + 2);

    // Measure glyph at 100px
    ctx.font = `100px "Courier New", monospace`;
    const glyphMetrics = ctx.measureText('█');
    const glyphHeight = glyphMetrics.actualBoundingBoxAscent + glyphMetrics.actualBoundingBoxDescent;

    // Restore original spacing feel
    const fontSize = Math.floor((charH / glyphHeight) * 100 * 0.95);

    ctx.font = `${fontSize}px "Courier New", monospace`;
    const finalGlyphWidth = ctx.measureText('█').width;

    // Frame right edge lines up with the last column
    const cols = Math.floor(innerW / finalGlyphWidth) - 1;

    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';

    // ---- Frame ----
    const frameColor = ansiColorMode ? CGA_PALETTE[11] : ANSI_MONO;
    ctx.fillStyle = frameColor;

    const topRow = '╔' + '═'.repeat(cols) + '╗';
    const botRow = '╚' + '═'.repeat(cols) + '╝';

    const topY = padY;
    const botY = padY + (ANSI_ROWS + 1) * charH;
    ctx.fillText(topRow, padX, topY);
    ctx.fillText(botRow, padX, botY);

    for (let r = 0; r < ANSI_ROWS; r++) {
        const rowY = padY + (r + 1) * charH;
        ctx.fillText('║', padX, rowY);
        ctx.fillText('║', padX + (cols + 1) * finalGlyphWidth, rowY);
    }

    // ---- Bars ----
    // Spread bins linearly across ALL columns (no log curve),
    // so the right side always has visible bars.
    const maxBin = freqData.length;
    const SHADES = ['█', '▓', '▒', '░'];
    const step = maxBin / cols; // even distribution

    for (let c = 0; c < cols; c++) {
        const binStart = Math.floor(c * step);
        const binEnd = Math.floor((c + 1) * step);
        const span = Math.max(1, binEnd - binStart);

        let sum = 0;
        for (let j = binStart; j < binStart + span && j < maxBin; j++) {
            sum += freqData[j];
        }
        let value = sum / span / 255;

        // Slight boost so quiet right-side bars still show a little something
        value = Math.pow(value, 0.7);
        value = Math.min(1, value * 1.5);

        // Ensure at least 1 row shows up so there's never a fully empty column
        const filledRows = Math.max(1, Math.round(value * ANSI_ROWS));

        let colColor;
        if (ansiColorMode) {
            colColor = CGA_PALETTE[ANSI_COLORS[c % ANSI_COLORS.length]];
        } else {
            colColor = ANSI_MONO;
        }
        ctx.fillStyle = colColor;

        for (let r = 0; r < filledRows; r++) {
            const shadeIndex = Math.min(r, SHADES.length - 1);
            const char = SHADES[shadeIndex];
            const x = padX + (c + 1) * finalGlyphWidth;
            const y = padY + (ANSI_ROWS - r) * charH;
            ctx.fillText(char, x, y);
        }
    }
}

    function drawAscii() {
        analyser.getByteFrequencyData(freqData);
        const usableBins = Math.floor(freqData.length * 0.3);
        const step = usableBins / ASCII_COLS;
        const bins = new Array(ASCII_COLS).fill(0);

        for (let c = 0; c < ASCII_COLS; c++) {
            const start = Math.floor(c * step);
            const end = Math.floor((c + 1) * step);
            let sum = 0;
            for (let j = start; j < end; j++) sum += freqData[j];
            bins[c] = sum / (end - start) / 255;
        }

        let output = '';
        for (let r = 0; r < ASCII_ROWS; r++) {
            const threshold = 1 - (r + 1) / ASCII_ROWS;
            for (let c = 0; c < ASCII_COLS; c++) {
                const value = Math.min(1, bins[c] * 1.3);
                if (value > threshold) {
                    const idx = Math.floor(value * (ASCII_CHARS.length - 1));
                    output += ASCII_CHARS[idx];
                } else {
                    output += ' ';
                }
            }
            output += '\n';
        }
        asciiViz.textContent = output;
    }

    function draw() {
        requestAnimationFrame(draw);

        if (visualizerDisabled) return;

        if (currentStyle === 'ascii') {
            if (analyser) drawAscii();
            return;
        }

        if (canvas.style.display === 'none') return;
        const rect = canvas.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        if (w < 10 || h < 10) return;

        if (!analyser) {
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#222';
            ctx.beginPath();
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            ctx.stroke();
            return;
        }

        ctx.clearRect(0, 0, w, h);
        if (currentStyle === 'wave') drawWave(w, h);
        else if (currentStyle === 'ansi') drawANSI(w, h);
        else drawBars(w, h);
    }

    audio.addEventListener('play', () => {
        initVisualizer();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        updateRadioStarState();
    });

    draw();

    // ============ WIREFRAME GLOBE WITH CONTINENTS ============
    (function initGlobe() {
        const globeCanvas = document.getElementById('globeCanvas');
        if (!globeCanvas) return;
        const gctx = globeCanvas.getContext('2d');

        let globeHue = 150;
        let globeSat = 100;
        let globeLight = 55;

        const worldMap = new Image();
        worldMap.crossOrigin = 'anonymous';
        let mapData = null;
        let mapWidth = 0;
        let mapHeight = 0;

        worldMap.onload = () => {
            const off = document.createElement('canvas');
            off.width = worldMap.naturalWidth;
            off.height = worldMap.naturalHeight;
            const octx = off.getContext('2d');
            octx.drawImage(worldMap, 0, 0);
            mapWidth = worldMap.naturalWidth;
            mapHeight = worldMap.naturalHeight;
            mapData = octx.getImageData(0, 0, mapWidth, mapHeight).data;
        };
        worldMap.onerror = () => {
            console.error('Failed to load world map');
        };
        worldMap.src = 'https://raw.githubusercontent.com/WlSDXM/famelack-data/main/world-map.png';

        function isLand(lat, lon) {
            if (!mapData) return false;
            const x = Math.floor(((lon + 180) / 360) * mapWidth);
            const y = Math.floor(((90 - lat) / 180) * mapHeight);
            if (x < 0 || x >= mapWidth || y < 0 || y >= mapHeight) return false;
            const idx = (y * mapWidth + x) * 4;
            const brightness = (mapData[idx] + mapData[idx + 1] + mapData[idx + 2]) / 3;
            return brightness > 128;
        }

        function sizeGlobe() {
            const rect = globeCanvas.getBoundingClientRect();
            const w = Math.floor(rect.width);
            const h = Math.floor(rect.height);
            if (w < 10 || h < 10) return;
            const dpr = window.devicePixelRatio || 1;
            globeCanvas.width = w * dpr;
            globeCanvas.height = h * dpr;
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.scale(dpr, dpr);
        }
        sizeGlobe();
        window.addEventListener('resize', sizeGlobe);

        globeCanvas.addEventListener('click', () => {
            globeHue = Math.floor(Math.random() * 360);
        });

        let rotation = 0;
        const LAT_LINES = 12;
        const LON_LINES = 16;
        const RADIUS_RATIO = 0.424;
        const DOT_STEP = 3;

        function drawGlobe() {
            requestAnimationFrame(drawGlobe);

            const rect = globeCanvas.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            if (w < 10 || h < 10) return;

            gctx.clearRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            const r = Math.min(w, h) * RADIUS_RATIO;

            const baseColor = `hsl(${globeHue}, ${globeSat}%, ${globeLight}%)`;
            const dimColor = `hsla(${globeHue}, ${globeSat}%, ${globeLight}%, 0.35)`;
            const dotColor = `hsl(${globeHue}, ${globeSat}%, ${globeLight + 10}%)`;
            const dotDimColor = `hsla(${globeHue}, ${globeSat}%, ${globeLight + 10}%, 0.25)`;

            for (let i = 1; i < LAT_LINES; i++) {
                const lat = (i / LAT_LINES) * Math.PI - Math.PI / 2;
                const ringRadius = r * Math.cos(lat);
                const yOffset = r * Math.sin(lat);

                gctx.beginPath();
                gctx.ellipse(cx, cy + yOffset, ringRadius, ringRadius * 0.28, 0, 0, Math.PI * 2);
                gctx.strokeStyle = dimColor;
                gctx.lineWidth = 0.5;
                gctx.stroke();
            }

            for (let i = 0; i < LON_LINES; i++) {
                const lon = (i / LON_LINES) * Math.PI * 2 + rotation;
                const xScale = Math.cos(lon);
                const isFront = xScale > 0;

                gctx.beginPath();
                gctx.ellipse(cx, cy, Math.abs(r * xScale), r, 0, 0, Math.PI * 2);
                gctx.strokeStyle = isFront ? dimColor : `hsla(${globeHue}, ${globeSat}%, ${globeLight}%, 0.15)`;
                gctx.lineWidth = isFront ? 0.6 : 0.4;
                gctx.stroke();
            }

            if (mapData) {
                for (let lat = -90; lat <= 90; lat += DOT_STEP) {
                    for (let lon = -180; lon < 180; lon += DOT_STEP) {
                        if (!isLand(lat, lon)) continue;

                        const latRad = lat * Math.PI / 180;
                        const lonRad = lon * Math.PI / 180;
                        const rotLon = lonRad + rotation;

                        const x3d = r * Math.cos(latRad) * Math.sin(rotLon);
                        const y3d = -r * Math.sin(latRad);
                        const z3d = r * Math.cos(latRad) * Math.cos(rotLon);

                        const isFront = z3d > 0;
                        const x2d = cx + x3d;
                        const y2d = cy + y3d;

                        const size = isFront ? 1.4 : 0.8;
                        gctx.beginPath();
                        gctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                        gctx.fillStyle = isFront ? dotColor : dotDimColor;
                        gctx.fill();
                    }
                }
            }

            gctx.beginPath();
            gctx.arc(cx, cy, r, 0, Math.PI * 2);
            gctx.strokeStyle = baseColor;
            gctx.lineWidth = 1.2;
            gctx.stroke();

            rotation += 0.003;
        }
        drawGlobe();
    })();

    // ============ KEYBOARD SHORTCUTS ============
    document.addEventListener('keydown', (e) => {
        const tag = document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
        if (e.ctrlKey || e.altKey || e.metaKey) return;

        switch (e.key) {
            case 'ArrowLeft':
                e.preventDefault();
                if (camIndex > 0) {
                    camIndex--;
                    playWebcam(camIndex);
                    updateCamNav();
                    camSelect.value = `cam:${camIndex}`;
                }
                break;

            case 'ArrowRight':
                e.preventDefault();
                if (camIndex < camList.length - 1) {
                    camIndex++;
                    playWebcam(camIndex);
                    updateCamNav();
                    camSelect.value = `cam:${camIndex}`;
                }
                break;

            case ' ':
                if (!audio.src) return;
                e.preventDefault();
                if (audio.paused) {
                    audio.play().catch(err => console.log('Playback failed:', err));
                } else {
                    audio.pause();
                }
                break;

            case 'f':
            case 'F':
                if (!webcamFrame) return;
                e.preventDefault();
                if (!document.fullscreenElement) {
                    webcamFrame.requestFullscreen().catch(err => {
                        console.warn('Fullscreen failed:', err);
                    });
                } else {
                    document.exitFullscreen();
                }
                break;
        }
    });

    // ============ INIT ============
    loadWebcamCountries();
    loadRadioCountries();
</script>
</body>
</html>
