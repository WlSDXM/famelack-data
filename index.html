<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Earth — World Views & Radio</title>
    <link rel="icon" href="https://i.imgur.com/KwX2CTv.gif">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/9nxv1t.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://files.catbox.moe/9nxv1t.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://files.catbox.moe/9nxv1t.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta property="og:image" content="https://i.postimg.cc/bJBx0GRz/jpnearth-ascii-art-ezgif-com-optimize-(1).gif" />
    <meta property="twitter:card" content="summary_large_image">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #0a0a0a;
            --border-color: #333;
            --text-color: #e0e0e0;
            --text-muted: #888;
            --accent-color: #4a9eff;
        }

        body.day-mode {
            --bg-color: #B8B8B8;
            --surface-color: #e8e8e8;
            --border-color: #999;
            --text-color: #1a1a1a;
            --text-muted: #555;
            --accent-color: #1a6fcc;
        }

        @font-face {
            font-family: 'stealth57';
            src: url('https://raw.githubusercontent.com/WlSDXM/famelack-data/main/stealth57.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; }

        html {
            background-color: var(--bg-color) !important;
            min-height: 100%;
        }

        body {
            background-color: var(--bg-color) !important;
            min-height: 100vh;
            color: var(--text-color);
            font-family: 'stealth57', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 17px;
            line-height: 1.5;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1.earth-title {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin: 0 0 20px 0;
            text-align: center;
        }
        img.earth-anim {
            max-width: 100%;
            height: 80px;
            width: auto;
            display: block;
            margin: 0 auto;
        }
        a.earth-link {
            display: block;
            width: fit-content;
            margin: 0 auto;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        a.earth-link:hover {
            transform: scale(1.03);
        }

        .layout-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            gap: 30px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
            min-width: 0;
        }

        .right-column .player-box {
            min-height: 380px;
        }

        .player-box {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        h2 {
            color: var(--accent-color);
            margin-top: 0;
        }
        h2.title-gif {
            margin-top: 0;
            line-height: 1;
        }
        img.title-img {
            display: block;
            height: 40px;
            width: auto;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            min-width: 0;
            overflow: hidden;
        }

        select {
            flex: 1 1 0%;
            min-width: 0;
            width: 0;
            max-width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 16px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
            box-sizing: border-box;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        select:focus { outline: none; border-color: var(--accent-color); }

        video {
            width: 100%;
            border-radius: 4px;
            background-color: #000;
            display: block;
        }
        iframe#webcamFrame {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 4px;
            background-color: #000;
            display: block;
        }
        audio { width: 100%; margin-top: 4px; }

        .cam-nav {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 10px;
        }
        .cam-nav.visible { display: flex; }
        .cam-nav button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 15px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .cam-nav button:hover:not(:disabled) {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .cam-nav button:disabled { opacity: 0.35; cursor: default; }
        .cam-title {
            flex: 1;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .cam-star {
            background-color: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 15px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
            line-height: 1;
            transition: color 0.15s, border-color 0.15s, text-shadow 0.15s, background-color 0.3s;
        }
        .cam-star:hover {
            border-color: #ffd966;
            color: #ffd966;
        }
        .cam-star.active {
            color: #ffd966;
            border-color: #ffd966;
            text-shadow: 0 0 6px rgba(255, 217, 102, 0.6);
        }

        option.favorites-separator {
            color: var(--border-color);
            font-size: 10px;
            pointer-events: none;
            background: var(--bg-color);
        }

        .viz-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }
        .viz-controls label {
            color: var(--text-muted);
            font-size: 14px;
            font-family: 'stealth57', monospace;
        }
        .viz-controls select { flex: 0 0 160px; }

        #visualizer, pre#asciiViz {
            width: 100% !important;
            max-width: 100%;
            height: 90px !important;
            min-height: 90px;
            max-height: 90px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px;
            display: block;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        pre#asciiViz {
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 11px;
            line-height: 1.05;
            color: var(--accent-color);
            padding: 8px;
            margin: 10px 0 0 0;
            white-space: pre;
            overflow: hidden;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            word-break: break-all;
        }

        .viz-fallback {
            display: none;
            width: 100%;
            height: 90px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 13px;
            font-family: 'stealth57', monospace;
            text-align: center;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .viz-fallback.visible {
            display: flex;
        }

        #globeCanvas {
            width: 100%;
            height: 236px;
            display: block;
            cursor: pointer;
            background: transparent;
            border: none;
            margin: 0 auto;
            margin-top: -25px;
        }

        body.day-mode #globeCanvas {
            filter:
                drop-shadow(0 0 3px rgba(0, 0, 0, 0.5))
                drop-shadow(0 0 8px rgba(0, 0, 0, 0.35))
                drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
        }

        .floating-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .floating-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-color);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.2s, border-color 0.2s, background-color 0.3s, color 0.3s;
            font-family: 'Segoe UI Emoji', 'Apple Color Emoji', system-ui, sans-serif;
        }
        .floating-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent-color);
        }
        .floating-btn:active {
            transform: scale(0.95);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-panel {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            min-width: 280px;
            max-width: 90vw;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }
        .modal-backdrop.open .modal-panel {
            transform: scale(1);
        }

        .modal-title {
            font-size: 15px;
            font-family: 'stealth57', system-ui, sans-serif;
            color: var(--text-color);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .modal-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'stealth57', monospace;
            margin-bottom: 16px;
        }

        .modal-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: 'stealth57', system-ui, sans-serif;
            font-size: 15px;
            text-align: left;
            padding: 12px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background-color 0.15s, color 0.15s, border-color 0.15s;
        }
        .modal-item:hover {
            background: var(--bg-color);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .modal-close {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'stealth57', monospace;
            font-size: 13px;
            padding: 10px;
            cursor: pointer;
            margin-top: 8px;
            transition: color 0.15s;
        }
        .modal-close:hover {
            color: var(--text-color);
        }

        .fm-icon {
            display: inline-block;
            width: 16px;
            text-align: center;
            opacity: 0.8;
        }

        @media (max-width: 700px) {
            .floating-controls {
                bottom: 12px;
                left: 12px;
                gap: 8px;
            }
            .floating-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            border-color: var(--accent-color);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
                padding-bottom: 10px;
            }

            .container { max-width: 100%; }

            h1.earth-title {
                padding-bottom: 6px;
                margin: 0 0 12px 0;
            }

            img.earth-anim { height: 55px; }

            .layout-grid { gap: 16px; }
            .right-column { gap: 16px; }

            .player-box {
                padding: 12px;
                border-radius: 6px;
            }

            img.title-img { height: 28px; }

            .row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                margin-bottom: 10px;
            }

            select {
                width: 100%;
                font-size: 16px;
                padding: 10px 12px;
            }

            .cam-nav {
                gap: 6px;
                margin-top: 8px;
                flex-wrap: wrap;
            }

            .cam-nav button {
                padding: 10px 16px;
                font-size: 16px;
                min-width: 46px;
            }

            .cam-star {
                padding: 10px 16px;
                font-size: 18px;
                min-width: 46px;
            }

            .cam-title {
                font-size: 12px;
                flex-basis: 100%;
                order: -1;
                margin-bottom: 6px;
            }

            #visualizer, pre#asciiViz, .viz-fallback {
                height: 70px !important;
                min-height: 70px;
                max-height: 70px;
            }

            pre#asciiViz {
                font-size: 8px;
                line-height: 1.05;
                padding: 6px;
            }

            .viz-controls {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: flex-end;
            }

            .viz-controls select { flex: 1 1 100%; }

            #globeCanvas {
                height: 180px;
                margin-top: -10px;
            }

            iframe#webcamFrame,
            video { border-radius: 4px; }

            .right-column .player-box { min-height: auto; }
        }

        @media (max-width: 380px) {
            img.earth-anim { height: 42px; }
            img.title-img { height: 22px; }
            #globeCanvas { height: 150px; }
            .player-box { padding: 10px; }
        }

        img.earth-anim {
            filter:
                drop-shadow(0 0 2px rgba(57, 255, 20, 0.8))
                drop-shadow(0 0 6px rgba(57, 255, 20, 0.4));
        }

        body.day-mode img.earth-anim {
            filter:
                brightness(1.05)
                saturate(0.7)
                contrast(1.15)
                drop-shadow(0 0 1px rgba(57, 255, 20, 0.8))
                drop-shadow(0 0 3px rgba(57, 255, 20, 0.4));
        }

        img.title-img[alt="Live"] {
            filter: drop-shadow(0 0 1px rgba(180, 100, 255, 0.6));
        }

        body.day-mode img.title-img[alt="Live"] {
            filter:
                brightness(1.05)
                saturate(1.2)
                contrast(1.1)
                drop-shadow(0 0 1px rgba(180, 100, 255, 0.6))
                drop-shadow(0 0 3px rgba(180, 100, 255, 0.3));
        }

        img.title-img[alt="Radio"] {
            filter: drop-shadow(0 0 1px rgba(0, 220, 200, 0.6));
        }

        body.day-mode img.title-img[alt="Radio"] {
            filter:
                brightness(1.05)
                saturate(1.2)
                contrast(1.1)
                drop-shadow(0 0 1px rgba(0, 220, 200, 0.6))
                drop-shadow(0 0 3px rgba(0, 220, 200, 0.3));
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="earth-title">
        <a href="https://theokano.neocities.org/" class="earth-link" title="Back to Homepage" target="_blank" rel="noopener">
            <img src="https://i.postimg.cc/5NY61pbJ/EARTH-GIF2-CROP.gif" alt="EARTH" class="earth-anim">
        </a>
    </h1>

    <div class="layout-grid">
        <div class="player-box">
            <h2 class="title-gif">
                <img src="https://i.postimg.cc/zvM6nKtm/raibu-Live-transparent-GIF.gif" alt="Live" class="title-img">
            </h2>
            <div class="row">
                <select id="countrySelect">
                    <option value="">-- Select a Country --</option>
                </select>
                <select id="camSelect" disabled>
                    <option value="">-- Select a Cam --</option>
                </select>
            </div>
            <video id="webcamPlayer" controls autoplay muted></video>
            <div class="cam-nav" id="camNav">
                <button id="camPrev" title="Previous camera">◀</button>
                <span class="cam-title" id="camTitle"></span>
                <button id="camNext" title="Next camera">▶</button>
                <button id="camStar" class="cam-star" title="Save to favorites">★</button>
            </div>
        </div>

        <div class="right-column">
            <div class="player-box">
                <h2 class="title-gif">
                    <img src="https://i.postimg.cc/j29mzPg7/rajio-RADIO-TRANS-GIF.gif" alt="Radio" class="title-img">
                </h2>

                <div class="row">
                    <select id="radioCountrySelect">
                        <option value="">-- Select a Country --</option>
                    </select>
                </div>

                <div class="row">
                    <select id="radioStationSelect" disabled>
                        <option value="">-- Select a Station --</option>
                    </select>
                </div>

                <audio id="radioPlayer" controls crossorigin="anonymous"></audio>

                <div class="viz-controls">
                    <label for="vizStyle">Visualizer:</label>
                    <select id="vizStyle">
                        <option value="bars">Bars</option>
                        <option value="wave">Wave</option>
                        <option value="ascii">ASCII</option>
                        <option value="ansi">ANSI</option>
                        <option value="dots">Dots</option>
                        <option value="droplet">Droplet</option>
                        <option value="fish">Fish Tank</option>
                    </select>
                    <button id="radioStar" class="cam-star" title="Save to favorites" style="margin-left: auto;">★</button>
                </div>

                <canvas id="visualizer"></canvas>
                <pre id="asciiViz" style="display:none;"></pre>
                <div id="vizFallback" class="viz-fallback">Visualizer not available on this device</div>
            </div>

            <canvas id="globeCanvas" title="Click to change color"></canvas>
        </div>
    </div>
</div>

<div class="floating-controls">
    <button id="favoritesToggle" class="floating-btn" title="Favorites menu">⚙</button>
    <button id="themeToggle" class="theme-toggle floating-btn" title="Toggle day/night mode">☾</button>
</div>

<div id="favoritesModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-panel">
        <div class="modal-title">★ Favorites</div>
        <div class="modal-subtitle">Export or import your Live &amp; Radio favorites</div>

        <button id="favExportBtn" class="modal-item">
            <span class="fm-icon">↓</span> Export to file
        </button>
        <button id="favImportBtn" class="modal-item">
            <span class="fm-icon">↑</span> Import from file
        </button>

        <button id="favCloseBtn" class="modal-close">Close</button>
    </div>
    <input type="file" id="favImportInput" accept=".json,application/json" style="display:none;">
</div>

<script>
    const BASE = 'https://raw.githubusercontent.com/WlSDXM/famelack-data/main';

    const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    // ============ DAY / NIGHT TOGGLE ============
    (function initThemeToggle() {
        const toggle = document.getElementById('themeToggle');
        if (!toggle) return;

        const STORAGE_KEY = 'earth_themeMode';

        function applyTheme(mode) {
            if (mode === 'day') {
                document.body.classList.add('day-mode');
                toggle.textContent = '☀';
                toggle.title = 'Switch to night mode';
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', '#d4d4d4');
            } else {
                document.body.classList.remove('day-mode');
                toggle.textContent = '☾';
                toggle.title = 'Switch to day mode';
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', '#000000');
            }
        }

        const saved = localStorage.getItem(STORAGE_KEY) || 'night';
        applyTheme(saved);

        toggle.addEventListener('click', () => {
            const isDay = document.body.classList.contains('day-mode');
            const next = isDay ? 'night' : 'day';
            applyTheme(next);
            localStorage.setItem(STORAGE_KEY, next);
        });
    })();

    // ============ WEBCAM ============
    const video = document.getElementById('webcamPlayer');
    const countrySelect = document.getElementById('countrySelect');
    const camNav = document.getElementById('camNav');
    const camPrev = document.getElementById('camPrev');
    const camNext = document.getElementById('camNext');
    const camTitle = document.getElementById('camTitle');
    const camSelect = document.getElementById('camSelect');
    const camStar = document.getElementById('camStar');

    let camList = [];
    let camIndex = 0;
    let webcamFrame = null;

    const FAV_KEY = 'earth_favoriteCams';

    function getFavorites() {
        try {
            return JSON.parse(localStorage.getItem(FAV_KEY)) || [];
        } catch {
            return [];
        }
    }

    function saveFavorites(list) {
        localStorage.setItem(FAV_KEY, JSON.stringify(list));
    }

    function currentCamId() {
        const item = camList[camIndex];
        return item ? item.nanoid : null;
    }

    function updateStarState() {
        const id = currentCamId();
        const isFav = id && getFavorites().some(f => f.id === id);
        camStar.classList.toggle('active', !!isFav);
        camStar.title = isFav ? 'Remove from favorites' : 'Save to favorites';
    }

    function buildFavoritesGroup() {
        const favorites = getFavorites();
        if (favorites.length === 0) return;

        const group = document.createElement('optgroup');
        group.label = '★ Favorites';

        favorites.forEach(fav => {
            const opt = document.createElement('option');
            opt.value = `fav:${fav.id}`;
            opt.textContent = `${fav.name} (${fav.country.toUpperCase()})`;
            group.appendChild(opt);
        });

        camSelect.appendChild(group);

        const sep = document.createElement('option');
        sep.disabled = true;
        sep.textContent = '─────────────────────';
        sep.className = 'favorites-separator';
        camSelect.appendChild(sep);
    }

    camStar.addEventListener('click', () => {
        const item = camList[camIndex];
        if (!item) return;
        const favorites = getFavorites();
        const existing = favorites.findIndex(f => f.id === item.nanoid);

    function sizeCanvas() {
        if (!canvas || !ctx) return;
        const rect = canvas.getBoundingClientRect();
        const w = Math.floor(rect.width);
        const h = Math.floor(rect.height);
        if (w < 10 || h < 10) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }

    function initVisualizer() {
        if (visualizerDisabled) return;
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.8;
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            freqData = new Uint8Array(analyser.frequencyBinCount);
            timeData = new Uint8Array(analyser.fftSize);
        } catch (e) {
            console.warn('Visualizer init failed:', e);
            visualizerDisabled = true;
            if (canvas) canvas.style.display = 'none';
            if (asciiViz) asciiViz.style.display = 'none';

        }
    }

    function drawBars(w, h) {
        analyser.getByteFrequencyData(freqData);

        const barCount = 60;
        const barWidth = w / barCount;

        const segCount = 30;
        const segHeight = h / segCount;
        const segGap = 0.5;
        const drawSegHeight = segHeight - segGap;

        const usableBins = Math.floor(freqData.length * 0.4);

        let peak = 0.2;
        for (let j = 0; j < usableBins; j++) {
            if (freqData[j] > peak) peak = freqData[j];
        }
        peak /= 255;

        for (let i = 0; i < barCount; i++) {
            const t = i / (barCount - 1);

            const tStart = Math.pow(t, 1.8);
            const tEnd = Math.pow((i + 1) / barCount, 1.8);

            const binStart = Math.floor(tStart * usableBins);
            const binEnd = Math.max(binStart + 1, Math.floor(tEnd * usableBins));

            let sum = 0, count = 0;
            for (let j = binStart; j < binEnd && j < usableBins; j++) {
                sum += freqData[j];
                count++;
            }
            const rawValue = count > 0 ? (sum / count) / 255 : 0;

            if (rawValue < 0.02) continue;

            const compression = 0.3 + (1 - t) * 0.5;
            let value = Math.pow(rawValue, compression);

            value = value / peak;
            value = Math.pow(Math.min(1, value), 0.7);

            const floor = 0.22 * (1 - t);
            value = Math.max(floor, value);
            value = Math.min(1, value);

            const litSegments = Math.round(value * segCount);
            const x = i * barWidth;

            for (let s = 0; s < litSegments; s++) {
                const y = h - (s + 1) * segHeight + segGap / 2;
                const litPos = s / Math.max(1, litSegments - 1);

                let hue, sat, light;
                if (litPos < 0.35) {
                    const localT = litPos / 0.35;
                    hue = 220;
                    sat = 15 + localT * 30;
                    light = 35 + localT * 15;
                } else if (litPos < 0.75) {
                    const localT = (litPos - 0.35) / 0.4;
                    hue = 250 + localT * 60;
                    sat = 45 + localT * 35;
                    light = 50 + localT * 10;
                } else {
                    const localT = (litPos - 0.75) / 0.25;
                    hue = 310 + localT * 40;
                    sat = 80 + localT * 15;
                    light = 60 + localT * 20;
                }
                ctx.fillStyle = `hsl(${hue}, ${sat}%, ${light}%)`;

                ctx.fillRect(x + barWidth * 0.12, y, barWidth * 0.76, drawSegHeight);
            }

            if (litSegments > 0) {
                const topY = h - litSegments * segHeight + segGap / 2;
                ctx.fillStyle = 'hsl(350, 95%, 65%)';
                ctx.fillRect(x + barWidth * 0.12, topY, barWidth * 0.76, drawSegHeight);
            }
        }
    }

    function drawWave(w, h) {
        analyser.getByteTimeDomainData(timeData);

        const layers = 7;
        const base = new Array(timeData.length);
        for (let i = 0; i < timeData.length; i++) {
            base[i] = (timeData[i] - 128) / 128;
        }

        const smoothed = base.map((_, i) => {
            const a = base[Math.max(0, i - 2)];
            const b = base[i];
            const c = base[Math.min(base.length - 1, i + 2)];
            return (a + b * 2 + c) / 4;
        });

        const isDay = document.body.classList.contains('day-mode');

        for (let l = layers - 1; l >= 0; l--) {
            const depth = l / (layers - 1);
            const verticalOffset = depth * h * 0.28;
            const amplitude = (1 - depth * 0.35);
            const phaseShift = Math.floor(depth * 12);

            const alpha = 0.85 - depth * 0.6;
            const lightness = isDay
                ? 25 + (1 - depth) * 30
                : 95 - depth * 45;

            ctx.beginPath();
            for (let i = 0; i < smoothed.length; i++) {
                const src = smoothed[(i + phaseShift) % smoothed.length];
                const x = (i / (smoothed.length - 1)) * w;
                const y = h * 0.55 + src * (h * 0.35) * amplitude - verticalOffset;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }

            ctx.strokeStyle = `hsla(210, 60%, ${lightness}%, ${alpha})`;
            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        if (!window.__wavePeak || window.__wavePeak.length !== smoothed.length) {
            window.__wavePeak = new Array(smoothed.length).fill(0);
        }
        for (let i = 0; i < smoothed.length; i++) {
            const v = Math.abs(smoothed[i]);
            if (v > window.__wavePeak[i]) window.__wavePeak[i] = v;
            else window.__wavePeak[i] *= 0.97;
        }

        ctx.beginPath();
        for (let i = 0; i < smoothed.length; i++) {
            const x = (i / (smoothed.length - 1)) * w;
            const y = h * 0.55 - window.__wavePeak[i] * (h * 0.35);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = isDay
            ? 'rgba(160, 30, 50, 0.9)'
            : 'rgba(220, 60, 80, 0.85)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
    }

    const ASCII_CHARS = ' .:-=+*#%@';
    const ASCII_COLS = 60;

    // ============ ANSI VISUALIZER ============
    const CGA_PALETTE = [
        '#000000', '#0000AA', '#00AA00', '#00AAAA',
        '#AA0000', '#AA00AA', '#AA5500', '#AAAAAA',
        '#555555', '#5555FF', '#55FF55', '#55FFFF',
        '#FF5555', '#FF55FF', '#FFFF55', '#FFFFFF'
    ];

    const ANSI_COLORS = [9, 10, 11, 12, 13, 14, 15];

    const ANSI_COLS = 40;
    const ANSI_ROWS = 6;

    function getAnsiMono() {
        return document.body.classList.contains('day-mode') ? '#1a1a1a' : '#e0e0e0';
    }
    let ansiColorMode = false;

    canvas.addEventListener('click', () => {
        if (currentStyle === 'ansi') {
            ansiColorMode = !ansiColorMode;
        }
    });

    function drawANSI(w, h) {
        analyser.getByteFrequencyData(freqData);

        const padX = 8;
        const padY = 6;
        const innerW = w - padX * 2;
        const innerH = h - padY * 2;

        const charH = innerH / (ANSI_ROWS + 2);
        const charW = innerW / ANSI_COLS;

        const fontSize = Math.floor(charH * 0.75);

        ctx.font = `${fontSize}px "Courier New", monospace`;
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';

        const measuredGlyphWidth = ctx.measureText('═').width;
        const frameCols = Math.max(1, Math.floor(innerW / measuredGlyphWidth) - 1);

        const frameColor = ansiColorMode ? CGA_PALETTE[11] : getAnsiMono();
        ctx.fillStyle = frameColor;

        const topRow = '╔' + '═'.repeat(frameCols) + '╗';
        const botRow = '╚' + '═'.repeat(frameCols) + '╝';

        const topY = padY;
        const botY = padY + (ANSI_ROWS + 1) * charH;
        ctx.fillText(topRow, padX, topY);
        ctx.fillText(botRow, padX, botY);

        for (let r = 0; r < ANSI_ROWS; r++) {
            const rowY = padY + (r + 1) * charH;
            ctx.fillText('║', padX, rowY);
            ctx.fillText('║', padX + (frameCols + 1) * measuredGlyphWidth, rowY);
        }

        const usableBins = Math.floor(freqData.length * 0.4);
        const step = usableBins / ANSI_COLS;
        const SHADES = ['█', '▓', '▒', '░'];

        for (let c = 0; c < ANSI_COLS; c++) {
            const start = Math.floor(c * step);
            const end = Math.floor((c + 1) * step);
            let sum = 0;
            for (let j = start; j < end; j++) sum += freqData[j];
            let value = sum / (end - start) / 255;

            value = Math.pow(value, 0.7);
            value = Math.min(1, value * 1.2);

            const filledRows = Math.round(value * ANSI_ROWS);

            let colColor;
            if (ansiColorMode) {
                colColor = CGA_PALETTE[ANSI_COLORS[c % ANSI_COLORS.length]];
            } else {
                colColor = getAnsiMono();
            }
            ctx.fillStyle = colColor;

            for (let r = 0; r < filledRows; r++) {
                const shadeIndex = Math.min(r, SHADES.length - 1);
                const char = SHADES[shadeIndex];
                const x = padX + (c + 1) * charW;
                const y = padY + (ANSI_ROWS - r) * charH;
                ctx.fillText(char, x, y);
            }
        }
    }

    // ============ DOTS VISUALIZER ============
    if (!window.__dotsState) {
        window.__dotsState = {
            smoothed: null,
            cols: 0,
            rows: 0,
            drift: 0
        };
    }

    function drawDots(w, h) {
        analyser.getByteFrequencyData(freqData);

        const cols = 42;
        const rows = 12;

        const cellW = w / cols;
        const cellH = h / rows;
        const maxRadius = Math.min(cellW, cellH) * 0.45;
        const minRadius = 0.5;

        window.__dotsState.drift += 0.02;
        const drift = window.__dotsState.drift;

        if (!window.__dotsState.smoothed || window.__dotsState.cols !== cols || window.__dotsState.rows !== rows) {
            window.__dotsState.smoothed = new Array(cols * rows).fill(0);
            window.__dotsState.cols = cols;
            window.__dotsState.rows = rows;
        }

        const usableBins = Math.floor(freqData.length * 0.4);
        const spectrumPerCol = new Array(cols).fill(0);
        const colBinWidth = usableBins / cols;

        for (let c = 0; c < cols; c++) {
            const t = c / (cols - 1);
            const logT = Math.pow(t, 1.4);
            const bandCenter = Math.floor(logT * usableBins);

            const start = Math.max(0, bandCenter - Math.floor(colBinWidth / 2));
            const end = Math.min(usableBins, start + Math.max(1, Math.floor(colBinWidth)));

            let sum = 0, count = 0;
            for (let j = start; j < end; j++) { sum += freqData[j]; count++; }
            let value = count > 0 ? (sum / count) / 255 : 0;

            value = Math.pow(value, 0.6);
            spectrumPerCol[c] = value;
        }

        let peak = 0.15;
        for (let c = 0; c < cols; c++) {
            if (spectrumPerCol[c] > peak) peak = spectrumPerCol[c];
        }

        const HUE = 280;
        const SAT = 85;
        const LIGHT_TOP = 0;
        const LIGHT_BOTTOM = 65;

        for (let r = 0; r < rows; r++) {
            const rowT = r / (rows - 1);
            const baseLight = LIGHT_TOP + (LIGHT_BOTTOM - LIGHT_TOP) * rowT;

            for (let c = 0; c < cols; c++) {
                const i = r * cols + c;
                const t = c / (cols - 1);

                const rowCenter = (rows - 1) / 2;
                const rowDistance = Math.abs(r - rowCenter) / rowCenter;
                const rowFalloff = 1 - Math.pow(rowDistance, 1.6);

                const baseShape = 0.1 + rowFalloff * 0.15;

                const rawValue = spectrumPerCol[c] / peak;
                const current = window.__dotsState.smoothed[i];
                const smoothing = rawValue > current ? 0.35 : 0.08;
                const smoothed = current + (rawValue - current) * smoothing;
                window.__dotsState.smoothed[i] = smoothed;

                const rowPhase = r * 0.4;
                const wave = Math.sin(c * 0.35 + drift * 2 + rowPhase);
                const waveAmount = Math.max(0, wave) * 0.12;

                const rowStagger = Math.sin(r * Math.PI + drift * 1.3) * 0.06;

                const highFreqBias = t * 0.15;

                const value = Math.min(1,
                    baseShape
                    + smoothed * rowFalloff * 0.85
                    + waveAmount
                    + rowStagger * rowFalloff
                    + highFreqBias
                );

                const radius = minRadius + value * (maxRadius - minRadius);
                const x = c * cellW + cellW / 2;
                const y = r * cellH + cellH / 2;

                const alpha = 0.25 + value * 0.75;

                const lightness = baseLight + value * 15;

                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${HUE}, ${SAT}%, ${lightness}%, ${alpha})`;
                ctx.fill();
            }
        }

        // ---- FLOATING BUBBLES ----
        for (let i = 0; i < state.bubbles.length; i++) {
            const b = state.bubbles[i];
            b.yT -= b.speed;
            if (b.yT < -0.1) {
                b.yT = 1.05 + Math.random() * 0.3;
                b.xT = 0.1 + Math.random() * 0.8;
                b.size = 1 + Math.random() * 1.5;
            }
            const wobbleX = Math.sin(b.yT * 8 + b.wobblePhase) * 0.008;
            const bx = Math.round(w * (b.xT + wobbleX));
            const by = Math.round(h * b.yT);
            
            ctx.fillStyle = isDay ? `rgba(80, 80, 80, 0.45)` : `rgba(255, 255, 255, 0.45)`;
            ctx.fillRect(bx - pxUnit, by - pxUnit, pxUnit * 2, pxUnit * 2);
        }
    }

    // ---- Pixel helper ----
    function px(ctx, x, y, unit, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * unit, y * unit, unit, unit);
    }
    function rgba(c, a) {
        return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
    }

    // ---- Pixel fish ----
    function drawPixelFish(ctx, centerX, centerY, unit, facing, wiggle, outlineColor, alpha, hero = false) {
        const heroSprite = [
            ".....■■■.....",
            "....■...■....",
            "..■■■...■....",
            ".■.○.○.○.■...",
            "■..○.○.○..■■.",
            ".■.○.○.○.■..■",
            "..■■■...■..■■",
            "....■...■....",
            ".....■■■.....",
            "............."
        ];

        const simpleSprite = [
            "....■■■...",
            "..■■...■..",
            "■..○.○.■.■",
            "..■■...■..",
            "....■■■..."
        ];

        const sprite = hero ? heroSprite : simpleSprite;
        const rows = sprite.length;
        const cols = sprite[0].length;

        const startX = Math.floor(centerX / unit) - Math.floor(cols / 2);
        const startY = Math.floor(centerY / unit) - Math.floor(rows / 2);

        const bodyColor = rgba(outlineColor, alpha);
        const checkerColor = rgba(outlineColor, alpha * 0.55);

        const tailWag = Math.round(Math.sin(wiggle) * 1);

        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const ch = sprite[row][col];
                if (ch === '.') continue;

                let xOffset = 0;
                if (col >= cols - 3) {
                    const tailT = (col - (cols - 4)) / 3;
                    xOffset = Math.round(tailWag * tailT);
                }

                const finalCol = facing === -1 ? (cols - 1 - col) : col;
                const finalX = startX + finalCol + (facing === -1 ? -xOffset : xOffset);
                const finalY = startY + row;

                let color;
                if (ch === '○') color = checkerColor;
                else color = bodyColor;

                px(ctx, finalX, finalY, unit, color);
            }
        }
    }

    // ---- Pixel octopus ----
    function drawPixelOctopus(ctx, centerX, baseY, unit, fillColor, darkColor, time, bassPulse) {
        const startX = Math.floor(centerX / unit) - 6;
        const startY = Math.floor(baseY / unit) - 11;

        const fill = rgba(fillColor, 0.85);
        const dark = rgba(darkColor, 0.95);

        const sprite = [
            "....FFFFFF...",
            "..FFFFFFFFFF.",
            ".FFFDDDDDFFF.",
            "FFFDDEDDEDFFF",
            "FFFDDDDDDDFFF",
            "FFFFDDDDDFFF.",
            ".FFFFDDDFFF..",
            "..FFFDDDFFF..",
            ".FF.FFF.FFF..",
            "FF..FF..FF.F.",
            "F...F....F..F"
        ];

        const wiggleAmp = bassPulse;

        for (let row = 0; row < sprite.length; row++) {
            const line = sprite[row];
            for (let col = 0; col < line.length; col++) {
                const ch = line[col];
                if (ch === '.') continue;

                let xOffset = 0;
                if (row >= 8) {
                    const phase = col * 0.8;
                    xOffset = Math.round(Math.sin(time * 0.08 + phase) * wiggleAmp);
                }

                const finalX = startX + col + xOffset;
                const finalY = startY + row;

                let color;
                if (ch === 'E') color = '#000000';
                else if (ch === 'D') color = dark;
                else color = fill;

                px(ctx, finalX, finalY, unit, color);
            }
        }
    }

    // ---- Pixel anemone ----
    function drawPixelAnemone(ctx, centerX, baseY, unit, fillColor, darkColor, widthScale) {
        const widthCells = Math.round(6 * widthScale);
        const startX = Math.floor(centerX / unit) - Math.floor(widthCells / 2);
        const startY = Math.floor(baseY / unit) - 6;

        const fill = rgba(fillColor, 0.9);
        const dark = rgba(darkColor, 0.95);

        const sprite = [
            ".D..D.",
            ".D..D.",
            "DFFFFD",
            "DFFFFD",
            "DFFFFD",
            "DDFFDD"
        ];

        for (let row = 0; row < sprite.length; row++) {
            for (let col = 0; col < sprite[row].length; col++) {
                const ch = sprite[row][col];
                if (ch === '.') continue;

                const finalX = startX + col;
                const finalY = startY + row;
                const color = ch === 'D' ? dark : fill;
                px(ctx, finalX, finalY, unit, color);

                if (widthScale > 1.05 && col === 2) {
                    px(ctx, finalX + 1, finalY, unit, color);
                }
            }
        }
    }

    // ---- Pixel seaweed ----
    function drawPixelSeaweed(ctx, centerX, baseY, unit, height, lean, fillColor, darkColor) {
        const fill = rgba(fillColor, 0.75);
        const dark = rgba(darkColor, 0.9);
        const startX = Math.floor(centerX / unit);
        const startY = Math.floor(baseY / unit);

        for (let i = 0; i < height; i++) {
            const y = startY - 1 - i;
            const t = i / height;
            const xOffset = Math.round(lean * t * 1.5);
            const x = startX + xOffset;
            const color = (i % 2 === 0) ? fill : dark;
            px(ctx, x, y, unit, color);
        }
    }
        // ---- Pixel starfish ----
    function drawStarfish(ctx, centerX, baseY, unit, fillColor, darkColor) {
        const fill = rgba(fillColor, 0.9);
        const dark = rgba(darkColor, 0.9);
        const startX = Math.floor(centerX / unit);
        const startY = Math.floor(baseY / unit);

        // 7x7 pixel starfish
        const sprite = [
            "..D.D..",
            "..DFD..",
            "DDFFFDD",
            ".DFFFD.",
            "..DFD..",
            "..DFD..",
            "..D.D.."
        ];

        for (let row = 0; row < sprite.length; row++) {
            for (let col = 0; col < sprite[row].length; col++) {
                const ch = sprite[row][col];
                if (ch === '.') continue;
                const color = ch === 'D' ? dark : fill;
                px(ctx, startX + col, startY - sprite.length + 1 + row, unit, color);
            }
        }
    }

    // ---- Pixel coral ----
    function drawPixelCoral(ctx, centerX, baseY, unit, fillColor, darkColor) {
        const fill = rgba(fillColor, 0.7);
        const dark = rgba(darkColor, 0.9);
        const startX = Math.floor(centerX / unit);
        const startY = Math.floor(baseY / unit);

        const branch1 = [
            [0, -1], [0, -2], [0, -3], [0, -4],
            [-1, -5], [-1, -6], [-1, -7],
            [-1, -8], [-2, -9], [-2, -10],
            [-2, -11], [-3, -12], [-3, -13],
            [-4, -14], [-4, -15], [-5, -16]
        ];

        const branch2 = [
            [1, -1], [1, -2], [2, -3], [2, -4],
            [3, -5], [3, -6], [3, -7],
            [4, -8], [4, -9], [5, -10],
            [5, -11], [6, -12]
        ];

        const branch3 = [
            [0, -1], [0, -2], [0, -3],
            [1, -4], [1, -5], [1, -6]
        ];

        const drawBranch = (branch, color) => {
            for (const [dx, dy] of branch) {
                px(ctx, startX + dx, startY + dy, unit, color);
            }
        };

        drawBranch(branch1, dark);
        drawBranch(branch2, fill);
        drawBranch(branch3, fill);

        px(ctx, startX - 5, startY - 16, unit, dark);
        px(ctx, startX - 4, startY - 17, unit, dark);
        px(ctx, startX + 6, startY - 12, unit, dark);
        px(ctx, startX + 7, startY - 13, unit, dark);
        px(ctx, startX + 1, startY - 6, unit, dark);
    }

    function drawAscii() {
        analyser.getByteFrequencyData(freqData);
        const usableBins = Math.floor(freqData.length * 0.3);
        const step = usableBins / ASCII_COLS;
        const bins = new Array(ASCII_COLS).fill(0);

        for (let c = 0; c < ASCII_COLS; c++) {
            const start = Math.floor(c * step);
            const end = Math.floor((c + 1) * step);
            let sum = 0;
            for (let j = start; j < end; j++) sum += freqData[j];
            bins[c] = sum / (end - start) / 255;
        }

        let output = '';
        for (let r = 0; r < ASCII_ROWS; r++) {
            const threshold = 1 - (r + 1) / ASCII_ROWS;
            for (let c = 0; c < ASCII_COLS; c++) {
                const value = Math.min(1, bins[c] * 1.3);
                if (value > threshold) {
                    const idx = Math.floor(value * (ASCII_CHARS.length - 1));
                    output += ASCII_CHARS[idx];
                } else {
                    output += ' ';
                }
            }
            output += '\n';
        }
        asciiViz.textContent = output;
    }

    function draw() {
        requestAnimationFrame(draw);

        if (visualizerDisabled) return;

        if (currentStyle === 'ascii') {
            if (analyser) drawAscii();
            return;
        }

        if (canvas.style.display === 'none') return;
        const rect = canvas.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        if (w < 10 || h < 10) return;

        if (!analyser) {
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#222';
            ctx.beginPath();
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            ctx.stroke();
            return;
        }

        ctx.clearRect(0, 0, w, h);
        if (currentStyle === 'wave') drawWave(w, h);
        else if (currentStyle === 'ansi') drawANSI(w, h);
        else if (currentStyle === 'dots') drawDots(w, h);
        else if (currentStyle === 'droplet') drawDroplet(w, h);
        else if (currentStyle === 'fish') drawFishTank(w, h);
        else drawBars(w, h);
    }

    audio.addEventListener('play', () => {
        initVisualizer();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        updateRadioStarState();
    });

    draw();

    // ============ WIREFRAME GLOBE WITH CONTINENTS ============
    (function initGlobe() {
        const globeCanvas = document.getElementById('globeCanvas');
        if (!globeCanvas) return;
        const gctx = globeCanvas.getContext('2d');

        let globeHue = 150;
        let globeSat = 100;
        let globeLight = 55;

        const worldMap = new Image();
        worldMap.crossOrigin = 'anonymous';
        let mapData = null;
        let mapWidth = 0;
        let mapHeight = 0;

        worldMap.onload = () => {
            const off = document.createElement('canvas');
            off.width = worldMap.naturalWidth;
            off.height = worldMap.naturalHeight;
            const octx = off.getContext('2d');
            octx.drawImage(worldMap, 0, 0);
            mapWidth = worldMap.naturalWidth;
            mapHeight = worldMap.naturalHeight;
            mapData = octx.getImageData(0, 0, mapWidth, mapHeight).data;
        };
        worldMap.onerror = () => {
            console.error('Failed to load world map');
        };
        worldMap.src = 'https://raw.githubusercontent.com/WlSDXM/famelack-data/main/world-map.png';

        function isLand(lat, lon) {
            if (!mapData) return false;
            const x = Math.floor(((lon + 180) / 360) * mapWidth);
            const y = Math.floor(((90 - lat) / 180) * mapHeight);
            if (x < 0 || x >= mapWidth || y < 0 || y >= mapHeight) return false;
            const idx = (y * mapWidth + x) * 4;
            const brightness = (mapData[idx] + mapData[idx + 1] + mapData[idx + 2]) / 3;
            return brightness > 128;
        }

        function sizeGlobe() {
            const rect = globeCanvas.getBoundingClientRect();
            const w = Math.floor(rect.width);
            const h = Math.floor(rect.height);
            if (w < 10 || h < 10) return;
            const dpr = window.devicePixelRatio || 1;
            globeCanvas.width = w * dpr;
            globeCanvas.height = h * dpr;
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.scale(dpr, dpr);
        }
        sizeGlobe();
        window.addEventListener('resize', sizeGlobe);

        globeCanvas.addEventListener('click', () => {
            globeHue = Math.floor(Math.random() * 360);
        });

        let rotation = 0;
        const LAT_LINES = 12;
        const LON_LINES = 16;
        const RADIUS_RATIO = 0.424;
        const DOT_STEP = 3;

        function drawGlobe() {
            requestAnimationFrame(drawGlobe);

            const rect = globeCanvas.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            if (w < 10 || h < 10) return;

            gctx.clearRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            const r = Math.min(w, h) * RADIUS_RATIO;

            const baseColor = `hsl(${globeHue}, ${globeSat}%, ${globeLight}%)`;
            const dimColor = `hsla(${globeHue}, ${globeSat}%, ${globeLight}%, 0.35)`;
            const dotColor = `hsl(${globeHue}, ${globeSat}%, ${globeLight + 10}%)`;
            const dotDimColor = `hsla(${globeHue}, ${globeSat}%, ${globeLight + 10}%, 0.25)`;

            for (let i = 1; i < LAT_LINES; i++) {
                const lat = (i / LAT_LINES) * Math.PI - Math.PI / 2;
                const ringRadius = r * Math.cos(lat);
                const yOffset = r * Math.sin(lat);

                gctx.beginPath();
                gctx.ellipse(cx, cy + yOffset, ringRadius, ringRadius * 0.28, 0, 0, Math.PI * 2);
                gctx.strokeStyle = dimColor;
                gctx.lineWidth = 0.5;
                gctx.stroke();
            }

            for (let i = 0; i < LON_LINES; i++) {
                const lon = (i / LON_LINES) * Math.PI * 2 + rotation;
                const xScale = Math.cos(lon);
                const isFront = xScale > 0;

                gctx.beginPath();
                gctx.ellipse(cx, cy, Math.abs(r * xScale), r, 0, 0, Math.PI * 2);
                gctx.strokeStyle = isFront ? dimColor : `hsla(${globeHue}, ${globeSat}%, ${globeLight}%, 0.15)`;
                gctx.lineWidth = isFront ? 0.6 : 0.4;
                gctx.stroke();
            }

            if (mapData) {
                for (let lat = -90; lat <= 90; lat += DOT_STEP) {
                    for (let lon = -180; lon < 180; lon += DOT_STEP) {
                        if (!isLand(lat, lon)) continue;

                        const latRad = lat * Math.PI / 180;
                        const lonRad = lon * Math.PI / 180;
                        const rotLon = lonRad + rotation;

                        const x3d = r * Math.cos(latRad) * Math.sin(rotLon);
                        const y3d = -r * Math.sin(latRad);
                        const z3d = r * Math.cos(latRad) * Math.cos(rotLon);

                        const isFront = z3d > 0;
                        const x2d = cx + x3d;
                        const y2d = cy + y3d;

                        const size = isFront ? 1.4 : 0.8;
                        gctx.beginPath();
                        gctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                        gctx.fillStyle = isFront ? dotColor : dotDimColor;
                        gctx.fill();
                    }
                }
            }

            gctx.beginPath();
            gctx.arc(cx, cy, r, 0, Math.PI * 2);
            gctx.strokeStyle = baseColor;
            gctx.lineWidth = 1.2;
            gctx.stroke();

            rotation += 0.003;
        }
        drawGlobe();
    })();

    // ============ KEYBOARD SHORTCUTS ============
    document.addEventListener('keydown', (e) => {
        const tag = document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
        if (e.ctrlKey || e.altKey || e.metaKey) return;

        switch (e.key) {
            case 'ArrowLeft':
                e.preventDefault();
                if (camIndex > 0) {
                    camIndex--;
                    playWebcam(camIndex);
                    updateCamNav();
                    camSelect.value = `cam:${camIndex}`;
                }
                break;

            case 'ArrowRight':
                e.preventDefault();
                if (camIndex < camList.length - 1) {
                    camIndex++;
                    playWebcam(camIndex);
                    updateCamNav();
                    camSelect.value = `cam:${camIndex}`;
                }
                break;

            case ' ':
                if (!audio.src) return;
                e.preventDefault();
                if (audio.paused) {
                    audio.play().catch(err => console.log('Playback failed:', err));
                } else {
                    audio.pause();
                }
                break;

            case 'f':
            case 'F':
                if (!webcamFrame) return;
                e.preventDefault();
                if (!document.fullscreenElement) {
                    webcamFrame.requestFullscreen().catch(err => {
                        console.warn('Fullscreen failed:', err);
                    });
                } else {
                    document.exitFullscreen();
                }
                break;
        }
    });

    // ============ FAVORITES EXPORT / IMPORT ============
    (function initFavoritesModal() {
        const toggleBtn = document.getElementById('favoritesToggle');
        const modal = document.getElementById('favoritesModal');
        const closeBtn = document.getElementById('favCloseBtn');
        const exportBtn = document.getElementById('favExportBtn');
        const importBtn = document.getElementById('favImportBtn');
        const importInput = document.getElementById('favImportInput');

        if (!toggleBtn || !modal) return;

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
            }
        });

        if (closeBtn) {
            closeBtn.addEventListener('click', () => {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('open')) {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
            }
        });

        exportBtn.addEventListener('click', async () => {
            const payload = {
                version: 1,
                exported: new Date().toISOString(),
                app: 'earth',
                cams: getFavorites(),
                stations: getRadioFavorites()
            };

            const json = JSON.stringify(payload, null, 2);
            const filename = `earth-favorites-${new Date().toISOString().slice(0, 10)}.json`;

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            if (isMobile && navigator.canShare && typeof File !== 'undefined') {
                try {
                    const file = new File([json], filename, { type: 'application/json' });

                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: 'Earth Favorites'
                        });
                        modal.classList.remove('open');
                        modal.setAttribute('aria-hidden', 'true');
                        return;
                    }
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        modal.classList.remove('open');
                        modal.setAttribute('aria-hidden', 'true');
                        return;
                    }
                    console.warn('Share failed, falling back:', err);
                }
            }

            try {
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                setTimeout(() => URL.revokeObjectURL(url), 1000);

                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
            } catch (err) {
                console.error('Download failed:', err);
                alert('Export failed. Try again or use a desktop browser.');
            }
        });

        importBtn.addEventListener('click', () => {
            importInput.value = '';
            importInput.click();
        });

        importInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (typeof data !== 'object' || data === null) {
                        throw new Error('Invalid file format');
                    }

                    const incomingCams = Array.isArray(data.cams) ? data.cams : [];
                    const incomingStations = Array.isArray(data.stations) ? data.stations : [];

                    const existingCams = getFavorites();
                    const existingStations = getRadioFavorites();

                    const camIds = new Set(existingCams.map(c => c.id));
                    const stationUrls = new Set(existingStations.map(s => s.url));

                    let addedCams = 0;
                    let addedStations = 0;

                    incomingCams.forEach(cam => {
                        if (!cam || !cam.id || camIds.has(cam.id)) return;
                        existingCams.push(cam);
                        camIds.add(cam.id);
                        addedCams++;
                    });

                    incomingStations.forEach(station => {
                        if (!station || !station.url || stationUrls.has(station.url)) return;
                        existingStations.push(station);
                        stationUrls.add(station.url);
                        addedStations++;
                    });

                    saveFavorites(existingCams);
                    saveRadioFavorites(existingStations);

                    updateStarState();
                    updateRadioStarState();

                    document.querySelectorAll('optgroup').forEach(g => {
                        if (g.label && g.label.includes('Favorites')) g.remove();
                    });
                    buildFavoritesGroup();
                    buildRadioFavoritesGroup();

                    modal.classList.remove('open');
                    modal.setAttribute('aria-hidden', 'true');

                    if (addedCams || addedStations) {
                        alert(`Imported ${addedCams} cam${addedCams === 1 ? '' : 's'} and ${addedStations} station${addedStations === 1 ? '' : 's'}.\n\n(Duplicates skipped.)`);
                    } else {
                        alert('No new favorites found — everything was already in your list.');
                    }
                } catch (err) {
                    console.error('Import failed:', err);
                    alert('Could not read that file. Make sure it\'s a valid Earth favorites export.');
                }
            };
            reader.readAsText(file);
        });
    })();

    // ============ INIT ============
    loadWebcamCountries();
    loadRadioCountries();
</script>
