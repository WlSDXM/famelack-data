<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Earth — World Views & Radio</title>
    <link rel="icon" href="https://i.imgur.com/KwX2CTv.gif">
    <meta property="og:image" content="https://i.postimg.cc/bJBx0GRz/jpnearth-ascii-art-ezgif-com-optimize-(1).gif" />
    <meta property="twitter:card" content="summary_large_image">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #0a0a0a;
            --border-color: #333;
            --text-color: #e0e0e0;
            --text-muted: #888;
            --accent-color: #4a9eff;
        }

        @font-face {
            font-family: 'stealth57';
            src: url('https://raw.githubusercontent.com/WlSDXM/famelack-data/main/stealth57.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; }

        html {
            background-color: var(--bg-color) !important;
            min-height: 100%;
        }

        body {
            background-color: var(--bg-color) !important;
            min-height: 100vh;
            color: var(--text-color);
            font-family: 'stealth57', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 17px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        h1.earth-title {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin: 0 0 20px 0;
            text-align: center;
        }
        img.earth-anim {
            max-width: 100%;
            height: 80px;
            width: auto;
            display: block;
            margin: 0 auto;
            mix-blend-mode: lighten;
        }

        /* ===== LAYOUT GRID ===== */
        .layout-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            gap: 30px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
            min-width: 0;
        }

        .right-column .player-box {
            min-height: 380px;
        }

        /* ===== PLAYER BOXES ===== */
        .player-box {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: var(--accent-color);
            margin-top: 0;
        }
        h2.title-gif {
            margin-top: 0;
            line-height: 1;
        }
        img.title-img {
            display: block;
            height: 40px;
            width: auto;
            mix-blend-mode: lighten;
        }

        /* ===== FORM ROWS ===== */
        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            min-width: 0;
            overflow: hidden;
        }

        select {
            flex: 1 1 0%;
            min-width: 0;
            width: 0;
            max-width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 16px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
            box-sizing: border-box;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
        select:focus { outline: none; border-color: var(--accent-color); }

        /* ===== PLAYERS ===== */
        video {
            width: 100%;
            border-radius: 4px;
            background-color: #000;
            display: block;
        }
        iframe#webcamFrame {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 4px;
            background-color: #000;
            display: block;
        }
        audio { width: 100%; margin-top: 4px; }

        /* ===== CAMERA NAV ===== */
        .cam-nav {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 10px;
        }
        .cam-nav.visible { display: flex; }
        .cam-nav button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 15px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
        }
        .cam-nav button:hover:not(:disabled) {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .cam-nav button:disabled { opacity: 0.35; cursor: default; }
        .cam-title {
            flex: 1;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .cam-star {
            background-color: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 15px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
            line-height: 1;
            transition: color 0.15s, border-color 0.15s, text-shadow 0.15s;
        }
        .cam-star:hover {
            border-color: #ffd966;
            color: #ffd966;
        }
        .cam-star.active {
            color: #ffd966;
            border-color: #ffd966;
            text-shadow: 0 0 6px rgba(255, 217, 102, 0.6);
        }

        /* ===== VISUALIZER ===== */
        .viz-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }
        .viz-controls label {
            color: var(--text-muted);
            font-size: 14px;
            font-family: 'stealth57', monospace;
        }
        .viz-controls select { flex: 0 0 160px; }

        #visualizer, pre#asciiViz {
            width: 100% !important;
            max-width: 100%;
            height: 90px !important;
            min-height: 90px;
            max-height: 90px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px;
            display: block;
            box-sizing: border-box;
        }

        pre#asciiViz {
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 11px;
            line-height: 1.05;
            color: var(--accent-color);
            padding: 8px;
            margin: 10px 0 0 0;
            white-space: pre;
            overflow: hidden;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            word-break: break-all;
        }

        /* ===== VISUALIZER FALLBACK (mobile / unsupported) ===== */
        .viz-fallback {
            display: none;
            width: 100%;
            height: 90px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 13px;
            font-family: 'stealth57', monospace;
            text-align: center;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .viz-fallback.visible {
            display: flex;
        }

        /* ===== GLOBE ===== */
        #globeCanvas {
            width: 100%;
            height: 236px;
            display: block;
            cursor: pointer;
            background: transparent;
            border: none;
            margin: 0 auto;
            margin-top: -25px;
        }

        /* ============================================
           SYNC FAVORITES — UI
           ============================================ */
        .sync-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-family: 'stealth57', monospace;
            font-size: 13px;
            color: var(--text-muted);
        }

        .sync-row .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sync-row .sync-status.synced {
            color: #ffd966;
        }

        .sync-row button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px 12px;
            font-size: 13px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.15s, color 0.15s;
        }

        .sync-row button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .sync-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.15s ease;
        }

        .sync-modal-backdrop.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .sync-modal {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            color: var(--text-color);
            font-family: 'stealth57', monospace;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .sync-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .sync-modal-header h3 {
            margin: 0;
            color: var(--accent-color);
            font-size: 16px;
            font-family: 'stealth57', monospace;
        }

        .sync-modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            font-family: 'stealth57', monospace;
        }

        .sync-modal-close:hover {
            color: var(--text-color);
        }

        .sync-modal-body {
            font-size: 14px;
            line-height: 1.5;
        }

        .sync-modal-body p {
            margin: 0 0 12px 0;
            color: var(--text-muted);
        }

        .sync-btn-primary,
        .sync-btn-secondary {
            display: block;
            width: 100%;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'stealth57', monospace;
            cursor: pointer;
            margin-bottom: 10px;
            transition: border-color 0.15s, background 0.15s;
        }

        .sync-btn-primary {
            background: var(--bg-color);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .sync-btn-primary:hover {
            background: rgba(74, 158, 255, 0.1);
        }

        .sync-btn-secondary {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .sync-btn-secondary:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .sync-code-display {
            background: var(--bg-color);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin: 14px 0;
            text-align: center;
        }

        .sync-code-display .code {
            font-family: 'Courier New', monospace;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #ffd966;
            text-shadow: 0 0 10px rgba(255, 217, 102, 0.4);
            user-select: all;
            word-break: break-all;
        }

        .sync-code-display .copy-btn {
            margin-top: 12px;
            padding: 6px 16px;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'stealth57', monospace;
            font-size: 13px;
            cursor: pointer;
        }

        .sync-code-display .copy-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .sync-code-display .copy-btn.copied {
            border-color: #4caf50;
            color: #4caf50;
        }

        .sync-code-input {
            width: 100%;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            letter-spacing: 4px;
            text-align: center;
            text-transform: uppercase;
            margin: 14px 0;
            box-sizing: border-box;
        }

        .sync-code-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .sync-msg {
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin: 10px 0;
            display: none;
        }

        .sync-msg.visible {
            display: block;
        }

        .sync-msg.error {
            background: rgba(220, 60, 80, 0.15);
            border: 1px solid rgba(220, 60, 80, 0.5);
            color: #ff8598;
        }

        .sync-msg.success {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #90ee90;
        }

        .sync-msg.warning {
            background: rgba(255, 217, 102, 0.12);
            border: 1px solid rgba(255, 217, 102, 0.4);
            color: #ffd966;
        }

        .sync-modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .sync-modal-buttons button {
            flex: 1;
        }

        /* ============================================
           MOBILE OPTIMIZATION
           ============================================ */
        @media (max-width: 700px) {
            body {
                padding: 10px;
                padding-bottom: 10px;
            }

            .container {
                max-width: 100%;
            }

            h1.earth-title {
                padding-bottom: 6px;
                margin: 0 0 12px 0;
            }

            img.earth-anim {
                height: 55px;
            }

            .layout-grid {
                gap: 16px;
            }

            .right-column {
                gap: 16px;
            }

            .player-box {
                padding: 12px;
                border-radius: 6px;
            }

            img.title-img {
                height: 28px;
            }

            .row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                margin-bottom: 10px;
            }

            select {
                width: 100%;
                font-size: 16px;
                padding: 10px 12px;
            }

            .cam-nav {
                gap: 6px;
                margin-top: 8px;
                flex-wrap: wrap;
            }

            .cam-nav button {
                padding: 10px 16px;
                font-size: 16px;
                min-width: 46px;
            }

            .cam-star {
                padding: 10px 16px;
                font-size: 18px;
                min-width: 46px;
            }

            .cam-title {
                font-size: 12px;
                flex-basis: 100%;
                order: -1;
                margin-bottom: 6px;
            }

            #visualizer, pre#asciiViz, .viz-fallback {
                height: 70px !important;
                min-height: 70px;
                max-height: 70px;
            }

            pre#asciiViz {
                font-size: 8px;
                line-height: 1.05;
                padding: 6px;
            }

            .viz-controls {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: flex-end;
            }

            .viz-controls select {
                flex: 1 1 100%;
            }

            #globeCanvas {
                height: 180px;
                margin-top: -10px;
            }

            iframe#webcamFrame,
            video {
                border-radius: 4px;
            }

            .right-column .player-box {
                min-height: auto;
            }

            .sync-row {
                font-size: 12px;
            }

            .sync-row button {
                padding: 8px 14px;
                font-size: 13px;
                min-height: 40px;
            }

            .sync-modal {
                padding: 16px;
                max-width: 95%;
            }

            .sync-code-display .code {
                font-size: 26px;
                letter-spacing: 3px;
            }

            .sync-modal-buttons {
                flex-direction: column-reverse;
            }
        }

        /* Extra-small phones (iPhone SE, etc.) */
        @media (max-width: 380px) {
            img.earth-anim {
                height: 42px;
            }
            img.title-img {
                height: 22px;
            }
            #globeCanvas {
                height: 150px;
            }
            .player-box {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="earth-title">
        <img src="https://i.postimg.cc/K8TkJTVF/EARTHripple-ezgif-com-video-to-gif-converter.gif" alt="EARTH" class="earth-anim">
    </h1>

    <div class="layout-grid">

        <!-- ===== LIVE (left column) ===== -->
        <div class="player-box">
            <h2 class="title-gif">
                <img src="https://i.postimg.cc/QMsm9d2H/Live-ezgif-com-video-to-gif-converter.gif" alt="Live" class="title-img">
            </h2>
            <div class="row">
                <select id="countrySelect">
                    <option value="">-- Select a Country --</option>
                </select>
                <select id="camSelect" disabled>
                    <option value="">-- Select a Cam --</option>
                </select>
            </div>
            <video id="webcamPlayer" controls autoplay muted></video>
            <div class="cam-nav" id="camNav">
                <button id="camPrev" title="Previous camera">◀</button>
                <span class="cam-title" id="camTitle"></span>
                <button id="camNext" title="Next camera">▶</button>
                <button id="camStar" class="cam-star" title="Save to favorites">★</button>
            </div>
        </div>

        <!-- ===== RIGHT COLUMN (Radio + Globe) ===== -->
        <div class="right-column">

            <div class="player-box">
                <h2 class="title-gif">
                    <img src="https://i.postimg.cc/1zftKGhW/RADIO-ezgif-com-video-to-gif-converter.gif" alt="Radio" class="title-img">
                </h2>

                <div class="row">
                    <select id="radioCountrySelect">
                        <option value="">-- Select a Country --</option>
                    </select>
                </div>

                <div class="row">
                    <select id="radioStationSelect" disabled>
                        <option value="">-- Select a Station --</option>
                    </select>
                </div>

                <audio id="radioPlayer" controls crossorigin="anonymous"></audio>

                <div class="viz-controls">
                    <label for="vizStyle">Visualizer:</label>
                    <select id="vizStyle">
                        <option value="bars">Bars</option>
                        <option value="wave">Wave</option>
                        <option value="ascii">ASCII</option>
                    </select>
                    <button id="radioStar" class="cam-star" title="Save to favorites" style="margin-left: auto;">★</button>
                </div>

                <canvas id="visualizer"></canvas>
                <pre id="asciiViz" style="display:none;"></pre>
                <div id="vizFallback" class="viz-fallback">Visualizer not available on this device</div>

                <!-- ===== SYNC ROW ===== -->
                <div class="sync-row">
                    <div class="sync-status" id="syncStatus">☁ Sync across devices</div>
                    <button id="syncSetupBtn">Setup</button>
                </div>
            </div>

            <!-- ===== GLOBE (below Radio, no box) ===== -->
            <canvas id="globeCanvas" title="Click to change color"></canvas>

        </div>
    </div>
</div>

<!-- ===== SYNC MODAL ===== -->
<div class="sync-modal-backdrop" id="syncModal">
    <div class="sync-modal">
        <div class="sync-modal-header">
            <h3 id="syncModalTitle">Sync Favorites</h3>
            <button class="sync-modal-close" id="syncModalClose">×</button>
        </div>
        <div class="sync-modal-body" id="syncModalBody">
            <!-- Content is injected by JavaScript -->
        </div>
    </div>
</div>

<script>
    const BASE = 'https://raw.githubusercontent.com/WlSDXM/famelack-data/main';

    // ============ MOBILE DETECTION ============
    const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    // ============ WEBCAM ============
    const video = document.getElementById('webcamPlayer');
    const countrySelect = document.getElementById('countrySelect');
    const camNav = document.getElementById('camNav');
    const camPrev = document.getElementById('camPrev');
    const camNext = document.getElementById('camNext');
    const camTitle = document.getElementById('camTitle');
    const camSelect = document.getElementById('camSelect');
    const camStar = document.getElementById('camStar');

    let camList = [];
    let camIndex = 0;
    let webcamFrame = null;

    const FAV_KEY = 'earth_favoriteCams';

    function getFavorites() {
        try {
            return JSON.parse(localStorage.getItem(FAV_KEY)) || [];
        } catch {
            return [];
        }
    }

    function saveFavorites(list) {
        localStorage.setItem(FAV_KEY, JSON.stringify(list));
        if (typeof pushToServer === 'function') pushToServer();
    }

    function currentCamId() {
        const item = camList[camIndex];
        return item ? item.nanoid : null;
    }

    function updateStarState() {
        const id = currentCamId();
        const isFav = id && getFavorites().some(f => f.id === id);
        camStar.classList.toggle('active', !!isFav);
        camStar.title = isFav ? 'Remove from favorites' : 'Save to favorites';
    }

    function buildFavoritesGroup() {
        const favorites = getFavorites();
        if (favorites.length === 0) return;

        const group = document.createElement('optgroup');
        group.label = '★ Favorites';

        favorites.forEach(fav => {
            const opt = document.createElement('option');
            opt.value = `fav:${fav.id}`;
            opt.textContent = `${fav.name} (${fav.country.toUpperCase()})`;
            group.appendChild(opt);
        });

        camSelect.appendChild(group);
    }

    camStar.addEventListener('click', () => {
        const item = camList[camIndex];
        if (!item) return;
        const favorites = getFavorites();
        const existing = favorites.findIndex(f => f.id === item.nanoid);

        if (existing >= 0) {
            favorites.splice(existing, 1);
        } else {
            favorites.push({
                id: item.nanoid,
                name: item.name,
                country: countrySelect.value,
                youtube: item.sources.youtube[0]
            });
        }
        saveFavorites(favorites);
        updateStarState();
    });

    async function loadWebcamCountries() {
        try {
            const response = await fetch(`${BASE}/webcams/raw/countries_metadata.json`);
            const data = await response.json();
            Object.entries(data).forEach(([code, info]) => {
                if (!info.hasChannels) return;
                const option = document.createElement('option');

    function initVisualizer() {

    function drawBars(w, h) {
        analyser.getByteFrequencyData(freqData);
        const barCount = 500;
        const barWidth = w / barCount;
        const maxBin = freqData.length;

        for (let i = 0; i < barCount; i++) {
            const t = i / barCount;
            const logPos = Math.pow(t, 2.2);
            const binIndex = Math.floor(logPos * maxBin);

            const windowSize = Math.max(1, Math.floor(maxBin / barCount));
            let sum = 0, count = 0;
            for (let j = binIndex; j < binIndex + windowSize && j < freqData.length; j++) {
                sum += freqData[j];
                count++;
            }
            let value = count > 0 ? sum / count / 255 : 0;
            value = Math.pow(value, 0.7);
            value = Math.min(1, value * 1.15);

            const barHeight = value * (h * 0.9);
            const x = i * barWidth;
            const y = h - barHeight;

            const hue = 210 + (i / barCount) * 100;
            ctx.fillStyle = `hsl(${hue}, 80%, ${40 + value * 30}%)`;
            ctx.fillRect(x, y, barWidth, barHeight);
        }
    }

    function drawWave(w, h) {
        analyser.getByteTimeDomainData(timeData);

        const layers = 7;
        const base = new Array(timeData.length);
        for (let i = 0; i < timeData.length; i++) {
            base[i] = (timeData[i] - 128) / 128;
        }

        const smoothed = base.map((_, i) => {
            const a = base[Math.max(0, i - 2)];
            const b = base[i];
            const c = base[Math.min(base.length - 1, i + 2)];
            return (a + b * 2 + c) / 4;
        });

        for (let l = layers - 1; l >= 0; l--) {
            const depth = l / (layers - 1);
            const verticalOffset = depth * h * 0.28;
            const amplitude = (1 - depth * 0.35);
            const phaseShift = Math.floor(depth * 12);

            const alpha = 0.85 - depth * 0.6;
            const lightness = 95 - depth * 45;

            ctx.beginPath();
            for (let i = 0; i < smoothed.length; i++) {
                const src = smoothed[(i + phaseShift) % smoothed.length];
                const x = (i / (smoothed.length - 1)) * w;
                const y = h * 0.55 + src * (h * 0.35) * amplitude - verticalOffset;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }

            ctx.strokeStyle = `hsla(210, 30%, ${lightness}%, ${alpha})`;
            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        if (!window.__wavePeak || window.__wavePeak.length !== smoothed.length) {
            window.__wavePeak = new Array(smoothed.length).fill(0);
        }
        for (let i = 0; i < smoothed.length; i++) {
            const v = Math.abs(smoothed[i]);
            if (v > window.__wavePeak[i]) window.__wavePeak[i] = v;
            else window.__wavePeak[i] *= 0.97;
        }

        ctx.beginPath();
        for (let i = 0; i < smoothed.length; i++) {
            const x = (i / (smoothed.length - 1)) * w;
            const y = h * 0.55 - window.__wavePeak[i] * (h * 0.35);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(220, 60, 80, 0.85)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
    }

    const ASCII_CHARS = ' .:-=+*#%@';
    const ASCII_COLS = 60;
    const ASCII_ROWS = 8;

    function drawAscii() {
        analyser.getByteFrequencyData(freqData);
        const usableBins = Math.floor(freqData.length * 0.3);
        const step = usableBins / ASCII_COLS;
        const bins = new Array(ASCII_COLS).fill(0);

        for (let c = 0; c < ASCII_COLS; c++) {
            const start = Math.floor(c * step);
            const end = Math.floor((c + 1) * step);
            let sum = 0;
            for (let j = start; j < end; j++) sum += freqData[j];
            bins[c] = sum / (end - start) / 255;
        }

        let output = '';
        for (let r = 0; r < ASCII_ROWS; r++) {
            const threshold = 1 - (r + 1) / ASCII_ROWS;
            for (let c = 0; c < ASCII_COLS; c++) {
                const value = Math.min(1, bins[c] * 1.3);
                if (value > threshold) {
                    const idx = Math.floor(value * (ASCII_CHARS.length - 1));
                    output += ASCII_CHARS[idx];
                } else {
                    output += ' ';
                }
            }
            output += '\n';
        }
        asciiViz.textContent = output;
    }

    function draw() {
        requestAnimationFrame(draw);

        if (!analyser) {

            ctx.strokeStyle = '#222';
            ctx.beginPath();
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            ctx.stroke();
            return;
        }

        ctx.clearRect(0, 0, w, h);
        if (currentStyle === 'wave') drawWave(w, h);
        else drawBars(w, h);
    }

    // ============ WIREFRAME GLOBE WITH CONTINENTS ============
    (function initGlobe() {
        const globeCanvas = document.getElementById('globeCanvas');
        if (!globeCanvas) return;
        const gctx = globeCanvas.getContext('2d');

        let globeHue = 150;
        let globeSat = 100;
        let globeLight = 55;

        const worldMap = new Image();
        worldMap.crossOrigin = 'anonymous';
        let mapData = null;
        let mapWidth = 0;
        let mapHeight = 0;

        worldMap.onload = () => {
            const off = document.createElement('canvas');
            off.width = worldMap.naturalWidth;
            off.height = worldMap.naturalHeight;
            const octx = off.getContext('2d');
            octx.drawImage(worldMap, 0, 0);
            mapWidth = worldMap.naturalWidth;
            mapHeight = worldMap.naturalHeight;
            mapData = octx.getImageData(0, 0, mapWidth, mapHeight).data;
        };
        worldMap.onerror = () => {
            console.error('Failed to load world map');
        };
        worldMap.src = 'https://raw.githubusercontent.com/WlSDXM/famelack-data/main/world-map.png';

        function isLand(lat, lon) {
            if (!mapData) return false;
            const x = Math.floor(((lon + 180) / 360) * mapWidth);
            const y = Math.floor(((90 - lat) / 180) * mapHeight);
            if (x < 0 || x >= mapWidth || y < 0 || y >= mapHeight) return false;
            const idx = (y * mapWidth + x) * 4;
            const brightness = (mapData[idx] + mapData[idx + 1] + mapData[idx + 2]) / 3;
            return brightness > 128;
        }

        function sizeGlobe() {
            const rect = globeCanvas.getBoundingClientRect();
            const w = Math.floor(rect.width);
            const h = Math.floor(rect.height);
            if (w < 10 || h < 10) return;
            const dpr = window.devicePixelRatio || 1;
            globeCanvas.width = w * dpr;
            globeCanvas.height = h * dpr;
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.scale(dpr, dpr);
        }
        sizeGlobe();
        window.addEventListener('resize', sizeGlobe);

        globeCanvas.addEventListener('click', () => {
            globeHue = Math.floor(Math.random() * 360);
        });

        let rotation = 0;
        const LAT_LINES = 12;
        const LON_LINES = 16;
        const RADIUS_RATIO = 0.424;
        const DOT_STEP = 3;

        function drawGlobe() {
            requestAnimationFrame(drawGlobe);

            const rect = globeCanvas.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            if (w < 10 || h < 10) return;

            gctx.clearRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            const r = Math.min(w, h) * RADIUS_RATIO;

            const baseColor = `hsl(${globeHue}, ${globeSat}%, ${globeLight}%)`;
            const dimColor = `hsla(${globeHue}, ${globeSat}%, ${globeLight}%, 0.35)`;
            const dotColor = `hsl(${globeHue}, ${globeSat}%, ${globeLight + 10}%)`;
            const dotDimColor = `hsla(${globeHue}, ${globeSat}%, ${globeLight + 10}%, 0.25)`;

            for (let i = 1; i < LAT_LINES; i++) {
                const lat = (i / LAT_LINES) * Math.PI - Math.PI / 2;
                const ringRadius = r * Math.cos(lat);
                const yOffset = r * Math.sin(lat);

                gctx.beginPath();
                gctx.ellipse(cx, cy + yOffset, ringRadius, ringRadius * 0.28, 0, 0, Math.PI * 2);
                gctx.strokeStyle = dimColor;
                gctx.lineWidth = 0.5;
                gctx.stroke();
            }

            for (let i = 0; i < LON_LINES; i++) {
                const lon = (i / LON_LINES) * Math.PI * 2 + rotation;
                const xScale = Math.cos(lon);
                const isFront = xScale > 0;

                gctx.beginPath();
                gctx.ellipse(cx, cy, Math.abs(r * xScale), r, 0, 0, Math.PI * 2);
                gctx.strokeStyle = isFront ? dimColor : `hsla(${globeHue}, ${globeSat}%, ${globeLight}%, 0.15)`;
                gctx.lineWidth = isFront ? 0.6 : 0.4;
                gctx.stroke();
            }

            if (mapData) {
                for (let lat = -90; lat <= 90; lat += DOT_STEP) {
                    for (let lon = -180; lon < 180; lon += DOT_STEP) {
                        if (!isLand(lat, lon)) continue;

                        const latRad = lat * Math.PI / 180;
                        const lonRad = lon * Math.PI / 180;
                        const rotLon = lonRad + rotation;

                        const x3d = r * Math.cos(latRad) * Math.sin(rotLon);
                        const y3d = -r * Math.sin(latRad);
                        const z3d = r * Math.cos(latRad) * Math.cos(rotLon);

                        const isFront = z3d > 0;
                        const x2d = cx + x3d;
                        const y2d = cy + y3d;

                        const size = isFront ? 1.4 : 0.8;
                        gctx.beginPath();
                        gctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                        gctx.fillStyle = isFront ? dotColor : dotDimColor;
                        gctx.fill();
                    }
                }
            }

            gctx.beginPath();
            gctx.arc(cx, cy, r, 0, Math.PI * 2);
            gctx.strokeStyle = baseColor;
            gctx.lineWidth = 1.2;
            gctx.stroke();

            rotation += 0.003;
        }
        drawGlobe();
    })();

        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        return data.code;
    }

    async function pullFromServer(code) {
        const res = await fetch(`${SYNC_API}/get?code=${encodeURIComponent(code)}`);
        if (res.status === 404) throw new Error('Code not found');
        if (!res.ok) throw new Error('Server error');
        return await res.json();

    async function pushToServer() {
        const code = getSyncCode();
        if (!code) return;
        const payload = {
            cams: getFavorites(),
            stations: getRadioFavorites()
        };
        try {
            await fetch(`${SYNC_API}/save`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, favorites: payload })
            });
        } catch (err) {
            console.warn('Sync push failed:', err);
        }
    }

    function mergeFavorites(localList, cloudList, keyField) {
        const map = new Map();
        [...cloudList, ...localList].forEach(item => {
            map.set(item[keyField], item);
        });
        return Array.from(map.values());
    }

    function updateSyncStatusUI() {
        const code = getSyncCode();
        if (code) {
            syncStatus.textContent = `☁ Synced as ${code}`;
            syncStatus.classList.add('synced');
            syncSetupBtn.textContent = 'Manage';
        } else {
            syncStatus.textContent = '☁ Sync across devices';
            syncStatus.classList.remove('synced');
            syncSetupBtn.textContent = 'Setup';
        }
    }

    async function autoLoadIfSynced() {
        const code = getSyncCode();
        if (!code) return;
        try {
            const cloud = await pullFromServer(code);
            const mergedCams = mergeFavorites(getFavorites(), cloud.cams || [], 'id');
            const mergedStations = mergeFavorites(getRadioFavorites(), cloud.stations || [], 'url');
            localStorage.setItem(FAV_KEY, JSON.stringify(mergedCams));
            localStorage.setItem(RADIO_FAV_KEY, JSON.stringify(mergedStations));
            await pushToServer();
            console.log('Sync: loaded', mergedCams.length, 'cams and', mergedStations.length, 'stations');
        } catch (err) {
            console.warn('Auto-load sync failed:', err);
        }
    }

    function showSetupOptions() {
        syncModalTitle.textContent = 'Sync Favorites';
        syncModalBody.innerHTML = `
            <p>Sync your ★ favorites across all your devices.</p>
            <button class="sync-btn-primary" id="syncCreateBtn">Create new sync code</button>
            <button class="sync-btn-secondary" id="syncExistingBtn">I already have a code</button>
            <div class="sync-msg error" id="syncError"></div>
        `;
        document.getElementById('syncCreateBtn').addEventListener('click', handleCreate);
        document.getElementById('syncExistingBtn').addEventListener('click', showEnterCodeForm);
    }

    function showError(msg) {
        const err = document.getElementById('syncError');
        if (err) {
            err.textContent = msg;
            err.classList.add('visible');
        }
    }

    async function handleCreate() {
        syncModalBody.innerHTML = '<p>Creating your sync code…</p>';
        try {
            const code = await createSyncCode();
            setSyncCode(code);
            await pushToServer();
            updateSyncStatusUI();
            showCodeDisplay(code);
        } catch (err) {
            showSetupOptions();
            showError('Could not reach server. Try again later.');
        }
    }

    function showCodeDisplay(code) {
        syncModalTitle.textContent = 'Sync Code Created';
        syncModalBody.innerHTML = `
            <p>Write this down or copy it. Enter it on another device to load your favorites there.</p>
            <div class="sync-code-display">
                <div class="code">${code}</div>
                <button class="copy-btn" id="syncCopyBtn">Copy</button>
            </div>
            <div class="sync-msg success visible">✓ Sync is now active on this device.</div>
            <button class="sync-btn-secondary" id="syncDoneBtn">Done</button>
        `;
        document.getElementById('syncCopyBtn').addEventListener('click', async () => {
            const btn = document.getElementById('syncCopyBtn');
            try {
                await navigator.clipboard.writeText(code);
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 1500);
            } catch {
                btn.textContent = 'Copy failed';
            }
        });
        document.getElementById('syncDoneBtn').addEventListener('click', closeModal);
    }

    function showEnterCodeForm() {
        syncModalTitle.textContent = 'Enter Sync Code';
        syncModalBody.innerHTML = `
            <p>Enter your sync code to load your favorites on this device.</p>
            <input type="text" class="sync-code-input" id="syncCodeInput" maxlength="6" placeholder="XXXXXX" autocomplete="off" spellcheck="false">
            <div class="sync-msg error" id="syncError"></div>
            <div class="sync-modal-buttons">
                <button class="sync-btn-secondary" id="syncCancelBtn">Cancel</button>
                <button class="sync-btn-primary" id="syncLoadBtn">Load</button>
            </div>
        `;
        const input = document.getElementById('syncCodeInput');
        input.focus();
        input.addEventListener('input', () => {
            input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLoadCode();
        });
        document.getElementById('syncCancelBtn').addEventListener('click', showSetupOptions);
        document.getElementById('syncLoadBtn').addEventListener('click', handleLoadCode);
    }

    async function handleLoadCode() {
        const input = document.getElementById('syncCodeInput');
        const code = (input.value || '').trim().toUpperCase();
        if (code.length !== 6) {
            showError('Code must be 6 characters.');
            return;
        }
        syncModalBody.querySelector('.sync-msg.error').classList.remove('visible');
        document.getElementById('syncLoadBtn').textContent = 'Loading…';
        try {
            const cloud = await pullFromServer(code);
            const mergedCams = mergeFavorites(getFavorites(), cloud.cams || [], 'id');
            const mergedStations = mergeFavorites(getRadioFavorites(), cloud.stations || [], 'url');
            localStorage.setItem(FAV_KEY, JSON.stringify(mergedCams));
            localStorage.setItem(RADIO_FAV_KEY, JSON.stringify(mergedStations));
            setSyncCode(code);
            await pushToServer();
            updateSyncStatusUI();
            syncModalBody.innerHTML = `
                <div class="sync-msg success visible">✓ Sync active! Loaded ${mergedCams.length} cams + ${mergedStations.length} stations.</div>
                <button class="sync-btn-secondary" id="syncDoneBtn">Done</button>
            `;
            document.getElementById('syncDoneBtn').addEventListener('click', closeModal);
        } catch (err) {
            document.getElementById('syncLoadBtn').textContent = 'Load';
            showError(err.message === 'Code not found' ? 'Code not found. Check and try again.' : 'Server error. Try again.');
        }
    }

    function showManageOptions() {
        const code = getSyncCode();
        if (!code) return showSetupOptions();
        syncModalTitle.textContent = 'Manage Sync';
        syncModalBody.innerHTML = `
            <p>Synced as:</p>
            <div class="sync-code-display">
                <div class="code">${code}</div>
                <button class="copy-btn" id="syncCopyBtn2">Copy</button>
            </div>
            <button class="sync-btn-secondary" id="syncStopBtn">Stop syncing on this device</button>
            <button class="sync-btn-secondary" id="syncCloseBtn">Close</button>
        `;
        document.getElementById('syncCopyBtn2').addEventListener('click', async () => {
            const btn = document.getElementById('syncCopyBtn2');
            try {
                await navigator.clipboard.writeText(code);
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            } catch {}
        });
        document.getElementById('syncStopBtn').addEventListener('click', () => {
            setSyncCode(null);
            updateSyncStatusUI();
            closeModal();
        });
        document.getElementById('syncCloseBtn').addEventListener('click', closeModal);
    }

    syncSetupBtn.addEventListener('click', () => {
        if (getSyncCode()) {
            showManageOptions();
        } else {
            showSetupOptions();
        }
        openModal();
    });

    updateSyncStatusUI();
    autoLoadIfSynced();

    // ============ KEYBOARD SHORTCUTS ============
    document.addEventListener('keydown', (e) => {
        const tag = document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
        if (e.ctrlKey || e.altKey || e.metaKey) return;

        switch (e.key) {
            case 'ArrowLeft':
                e.preventDefault();
                if (camIndex > 0) {
                    camIndex--;
                    playWebcam(camIndex);
                    updateCamNav();
                    camSelect.value = `cam:${camIndex}`;
                }
                break;

            case 'ArrowRight':
                e.preventDefault();
                if (camIndex < camList.length - 1) {
                    camIndex++;
                    playWebcam(camIndex);
                    updateCamNav();
                    camSelect.value = `cam:${camIndex}`;
                }
                break;

            case ' ':
                if (!audio.src) return;
                e.preventDefault();
                if (audio.paused) {
                    audio.play().catch(err => console.log('Playback failed:', err));
                } else {
                    audio.pause();
                }
                break;

            case 'f':
            case 'F':
                if (!webcamFrame) return;
                e.preventDefault();
                if (!document.fullscreenElement) {
                    webcamFrame.requestFullscreen().catch(err => {
                        console.warn('Fullscreen failed:', err);
                    });
                } else {
                    document.exitFullscreen();
                }
                break;
        }
    });

    // ============ INIT ============
    loadWebcamCountries();
    loadRadioCountries();
</script>
</body>
</html>
