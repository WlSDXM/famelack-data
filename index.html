<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Earth — World Cams & Radio</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --border-color: #333;
            --text-color: #e0e0e0;
            --text-muted: #888;
            --accent-color: #4a9eff;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        h2 { color: var(--accent-color); margin-top: 0; }
        .player-box {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
        select {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 16px;
            cursor: pointer;
        }
        select:focus { outline: none; border-color: var(--accent-color); }
        video { width: 100%; border-radius: 4px; background-color: #000; }
        iframe#webcamFrame {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 4px;
            background-color: #000;
        }
        audio { width: 100%; margin-top: 4px; }

        .cam-nav {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 10px;
        }
        .cam-nav.visible { display: flex; }
        .cam-nav button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 15px;
            cursor: pointer;
        }
        .cam-nav button:hover:not(:disabled) { border-color: var(--accent-color); color: var(--accent-color); }
        .cam-nav button:disabled { opacity: 0.35; cursor: default; }
        .cam-title { flex: 1; text-align: center; color: var(--text-muted); font-size: 14px; }

        .viz-controls { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
        .viz-controls label { color: var(--text-muted); font-size: 14px; }
        .viz-controls select { flex: 0 0 160px; }

        canvas, pre#asciiViz {
    width: 100%;
    max-width: 100%;
    height: 160px;
    background-color: transparent;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    margin-top: 10px;
    display: block;
}
        pre#asciiViz {
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 11px;
            line-height: 1;
            color: var(--accent-color);
            padding: 8px;
            margin: 10px 0 0 0;
            overflow: hidden;
            white-space: pre;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌍 Earth</h1>

    <div class="player-box">
        <h2>📹 Live Webcams</h2>
        <div class="row">
            <select id="countrySelect">
                <option value="">-- Select a Country --</option>
            </select>
        </div>
        <video id="webcamPlayer" controls autoplay muted></video>
        <div class="cam-nav" id="camNav">
            <button id="camPrev" title="Previous camera">◀</button>
            <span class="cam-title" id="camTitle"></span>
            <button id="camNext" title="Next camera">▶</button>
        </div>
    </div>

    <div class="player-box">
        <h2>📻 Radio Stations</h2>
        <div class="row">
            <select id="radioCountrySelect">
                <option value="">-- Select a Country --</option>
            </select>
            <select id="radioStationSelect" disabled>
                <option value="">-- Select a Station --</option>
            </select>
        </div>
        <audio id="radioPlayer" controls crossorigin="anonymous"></audio>

        <div class="viz-controls">
            <label for="vizStyle">Visualizer:</label>
            <select id="vizStyle">
                <option value="bars">Bars</option>
                <option value="wave">Wave</option>
                <option value="ascii">ASCII</option>
            </select>
        </div>

        <canvas id="visualizer"></canvas>
        <pre id="asciiViz" style="display:none;"></pre>
    </div>
</div>

<script>
    const BASE = 'https://raw.githubusercontent.com/WlSDXM/famelack-data/main';

    // ============ WEBCAM ============
    const video = document.getElementById('webcamPlayer');
    const countrySelect = document.getElementById('countrySelect');
    const camNav = document.getElementById('camNav');
    const camPrev = document.getElementById('camPrev');
    const camNext = document.getElementById('camNext');
    const camTitle = document.getElementById('camTitle');

    let camList = [];
    let camIndex = 0;
    let webcamFrame = null;

    async function loadWebcamCountries() {
        try {
            const response = await fetch(`${BASE}/webcams/raw/countries_metadata.json`);
            const data = await response.json();
            Object.entries(data).forEach(([code, info]) => {
                if (!info.hasChannels) return;
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${info.country} (${info.channelCount})`;
                countrySelect.appendChild(option);
            });
        } catch (error) {
            console.error('Failed to load webcam countries:', error);
        }
    }

    countrySelect.addEventListener('change', async (e) => {
        const code = e.target.value;
        if (!code) return;
        try {
            const response = await fetch(`${BASE}/webcams/raw/countries/${code.toLowerCase()}.json`);
            const items = await response.json();
            camList = items.filter(i => i.sources && i.sources.youtube && i.sources.youtube[0]);
            camIndex = 0;
            updateCamNav();
            if (camList.length > 0) playWebcam(0);
        } catch (error) {
            console.error('Failed to load webcam data for', code, error);
        }
    });

    camPrev.addEventListener('click', () => {
        if (camIndex > 0) { camIndex--; playWebcam(camIndex); updateCamNav(); }
    });
    camNext.addEventListener('click', () => {
        if (camIndex < camList.length - 1) { camIndex++; playWebcam(camIndex); updateCamNav(); }
    });

    function updateCamNav() {
        if (camList.length <= 1) {
            camNav.classList.remove('visible');
            return;
        }
        camNav.classList.add('visible');
        camTitle.textContent = `${camList[camIndex].name} — ${camIndex + 1} / ${camList.length}`;
        camPrev.disabled = camIndex === 0;
        camNext.disabled = camIndex === camList.length - 1;
    }

    function playWebcam(index) {
        const item = camList[index];
        if (!item) return;
        const embedUrl = item.sources.youtube[0];

        if (!webcamFrame) {
            webcamFrame = document.createElement('iframe');
            webcamFrame.id = 'webcamFrame';
            webcamFrame.setAttribute('allow', 'autoplay; encrypted-media');
            video.parentElement.insertBefore(webcamFrame, video);
            video.style.display = 'none';
        }
        webcamFrame.src = embedUrl + '?autoplay=1&mute=1';
    }

    // ============ RADIO ============
    const audio = document.getElementById('radioPlayer');
    const radioCountrySelect = document.getElementById('radioCountrySelect');
    const radioStationSelect = document.getElementById('radioStationSelect');

    async function loadRadioCountries() {
        try {
            const response = await fetch(`${BASE}/radio/raw/countries_metadata.json`);
            const data = await response.json();
            Object.entries(data).forEach(([code, info]) => {
                if (!info.hasChannels) return;
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${info.country} (${info.channelCount})`;
                radioCountrySelect.appendChild(option);
            });
        } catch (error) {
            console.error('Failed to load radio countries:', error);
        }
    }

    radioCountrySelect.addEventListener('change', async (e) => {
        const code = e.target.value;
        radioStationSelect.innerHTML = '<option value="">-- Select a Station --</option>';
        radioStationSelect.disabled = true;
        if (!code) return;

        try {
            const response = await fetch(`${BASE}/radio/raw/countries/${code.toLowerCase()}.json`);
            const items = await response.json();
            if (!Array.isArray(items)) return;

            const seen = new Set();
            items.forEach((item) => {
                const streamUrl = item.sources && item.sources.streams && item.sources.streams[0];
                if (!streamUrl) return;
                const name = item.name || 'Unknown Station';
                if (seen.has(name)) return;
                seen.add(name);

                const option = document.createElement('option');
                option.value = streamUrl;
                option.textContent = name;
                radioStationSelect.appendChild(option);
            });
            radioStationSelect.disabled = false;
        } catch (error) {
            console.error('Failed to load radio stations for', code, error);
        }
    });

    radioStationSelect.addEventListener('change', (e) => {
        const url = e.target.value;
        if (!url) { audio.pause(); audio.src = ''; return; }
        audio.src = url;
        audio.play().catch(e => console.log('Playback failed:', e));
    });

    // ============ VISUALIZER ============
    const canvas = document.getElementById('visualizer');
    const asciiViz = document.getElementById('asciiViz');
    const vizStyleSelect = document.getElementById('vizStyle');
    const ctx = canvas.getContext('2d');

    let audioCtx, analyser, source, freqData, timeData;
    let currentStyle = 'bars';

    vizStyleSelect.addEventListener('change', (e) => {
    currentStyle = e.target.value;
    if (currentStyle === 'ascii') {
        canvas.style.display = 'none';
        asciiViz.style.display = 'block';
    } else {
        canvas.style.display = 'block';
        asciiViz.style.display = 'none';
        requestAnimationFrame(() => requestAnimationFrame(() => sizeCanvas()));
    }
});

function sizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.floor(rect.width);
    const h = Math.floor(rect.height);
    if (w < 10 || h < 10) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
}

window.addEventListener('load', () => sizeCanvas());

    function initVisualizer() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.8;
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            freqData = new Uint8Array(analyser.frequencyBinCount);
            timeData = new Uint8Array(analyser.fftSize);
        } catch (e) {
            console.warn('Visualizer init failed:', e);
        }
    }

    function drawBars(w, h) {
    analyser.getByteFrequencyData(freqData);
    const barCount = 48;
    const gap = 3;
    const totalGap = gap * (barCount - 1);
    const barWidth = (w - totalGap) / barCount;

    const usableBins = Math.floor(freqData.length * 0.3);
    const step = usableBins / barCount;

    for (let i = 0; i < barCount; i++) {
        const start = Math.floor(i * step);
        const end = Math.floor((i + 1) * step);

        let sum = 0;
        for (let j = start; j < end; j++) sum += freqData[j];
        let value = sum / (end - start) / 255;
        value = Math.min(1, value * 1.4);

        const barHeight = value * h;               // ← full height now
        const x = i * (barWidth + gap);
        const y = h - barHeight;

        const hue = 210 + (i / barCount) * 100;
        ctx.fillStyle = `hsl(${hue}, 80%, ${40 + value * 30}%)`;
        ctx.fillRect(x, y, barWidth, barHeight);

        // Horizontal baseline glow to bridge the gaps visually
        ctx.fillStyle = `hsla(${hue}, 80%, 50%, 0.35)`;
        ctx.fillRect(x, h - 2, barWidth, 2);
    }
}

    function drawWave(w, h) {
    analyser.getByteTimeDomainData(timeData);
    const mid = h / 2;
    const amp = h * 0.42;

    // Build points
    const points = [];
    for (let i = 0; i < timeData.length; i++) {
        const x = (i / (timeData.length - 1)) * w;
        const y = mid + ((timeData[i] - 128) / 128) * amp;
        points.push([x, y]);
    }

    // Filled area under the curve
    ctx.beginPath();
    ctx.moveTo(points[0][0], h);
    for (const [x, y] of points) ctx.lineTo(x, y);
    ctx.lineTo(points[points.length - 1][0], h);
    ctx.closePath();

    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, 'rgba(74, 158, 255, 0.0)');
    gradient.addColorStop(0.5, 'rgba(74, 158, 255, 0.25)');
    gradient.addColorStop(1, 'rgba(74, 158, 255, 0.5)');
    ctx.fillStyle = gradient;
    ctx.fill();

    // Stroke line on top
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (const [x, y] of points) ctx.lineTo(x, y);
    ctx.strokeStyle = '#4a9eff';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
}

    const ASCII_CHARS = ' .:-=+*#%@';
const ASCII_COLS = 96;
const ASCII_ROWS = 12;

function drawAscii() {
    analyser.getByteFrequencyData(freqData);
    const usableBins = Math.floor(freqData.length * 0.3);
    const step = usableBins / ASCII_COLS;
    const bins = new Array(ASCII_COLS).fill(0);

    for (let c = 0; c < ASCII_COLS; c++) {
        const start = Math.floor(c * step);
        const end = Math.floor((c + 1) * step);
        let sum = 0;
        for (let j = start; j < end; j++) sum += freqData[j];
        bins[c] = sum / (end - start) / 255;
    }

    let output = '';
    for (let r = 0; r < ASCII_ROWS; r++) {
        const threshold = 1 - (r + 1) / ASCII_ROWS;
        for (let c = 0; c < ASCII_COLS; c++) {
            const value = Math.min(1, bins[c] * 1.3);
            if (value > threshold) {
                const idx = Math.floor(value * (ASCII_CHARS.length - 1));
                output += ASCII_CHARS[idx];
            } else {
                output += ' ';
            }
        }
        output += '\n';
    }
    asciiViz.textContent = output;
}

    function draw() {
    requestAnimationFrame(draw);

    // ASCII runs first — it doesn't use the canvas at all
    if (currentStyle === 'ascii') {
        if (analyser) drawAscii();
        return;
    }

    // Canvas visualizers need a visible, sized canvas
    if (canvas.style.display === 'none') return;
    const rect = canvas.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    if (w < 10 || h < 10) return;

    if (!analyser) {
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#222';
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();
        return;
    }

    ctx.clearRect(0, 0, w, h);
    if (currentStyle === 'wave') drawWave(w, h);
    else drawBars(w, h);
}

    audio.addEventListener('play', () => {
        initVisualizer();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    });

    draw();

    // ============ INIT ============
    loadWebcamCountries();
    loadRadioCountries();
</script>
</body>
</html>
